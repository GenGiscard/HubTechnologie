<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP CAO 4e-2 — Matériaux et masse · ESTIC</title>
<style>
:root{--bg:#e9eef5;--pan:#fff;--ink:#1c2633;--mut:#5d6b7e;--line:#d5dde8;--acc:#1f4e8c;--acc2:#e07a10;--ok:#1a8a3a;--ko:#c0352b;--soft:#f3f6fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--mut);font-size:13px}
/* bandeau */
.estic-bar{height:46px;display:flex;align-items:center;gap:16px;padding:0 14px;background:#fff;border-bottom:3px solid var(--acc)}
.eb-left{display:flex;align-items:center;gap:10px;min-width:220px}
.eb-left b{display:block;font-size:13px}.eb-left span{font-size:11.5px;color:var(--mut)}
.eb-logo{background:var(--acc);color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;padding:6px 8px;border-radius:5px}
.eb-title{flex:1;text-align:center;font-weight:700;font-size:16px;color:var(--acc)}
.eb-right{display:flex;align-items:center;gap:12px;min-width:220px;justify-content:flex-end}
.eb-copy{font-size:11px;color:var(--mut)}
/* mise en page */
#app{display:flex;height:calc(100vh - 46px)}
.panel{background:var(--pan);overflow:auto}
#mission{width:370px;flex:none;border-right:1px solid var(--line);display:none}
.mode-tp #mission,.mode-eval #mission{display:block}
#side{width:230px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-h{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 12px 6px}
#treeList{flex:1;overflow:auto;padding:0 8px 8px}
.tree-empty{color:var(--mut);font-size:13px;padding:10px;line-height:1.5}
.feat{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.feat:hover{background:var(--soft)}.feat.on{background:#eaf1fb;border-color:#b9cde8}
.feat.hid{opacity:.45}
.fic svg{width:26px;height:26px;display:block}
.ftx b{display:block;font-size:13px}.ftx span{font-size:11.5px;color:var(--mut)}
.feat-acts{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px 10px 42px}
#props{border-top:1px solid var(--line);padding-bottom:10px}
#propVals{padding:4px 12px;transition:opacity .2s}#propVals.busy{opacity:.4}
.pv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.pv b{font-family:Consolas,'Courier New',monospace;font-weight:600;font-size:12px;white-space:nowrap}
.fld{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.fld span{flex:1;color:var(--mut)}
.fld input,.fld select{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-family:Consolas,'Courier New',monospace;background:#fff}
.fld select{width:150px;font-family:inherit}
.fld em{font-style:normal;color:var(--mut);width:22px;font-size:12px}
.fld.mat{padding:0 12px}
.fld-l{margin:8px 0;font-size:13px}.fld-l>span{display:block;color:var(--mut);margin-bottom:4px}
.dis{opacity:.35;pointer-events:none}
/* boutons */
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:#9fb3cf;background:#f7f9fc}
.btn.on{background:#eaf1fb;border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:#173d70}
.btn.danger{color:var(--ko);border-color:#efc4c0}.btn.danger:hover{background:#fdf1f0}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:7px 0 0 7px;margin-left:0}.seg .btn:last-child{border-radius:0 7px 7px 0}
.seg.wide{display:flex}.seg.wide .btn{flex:1;justify-content:center}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
/* zone de travail */
#work{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.toolbar .grow{flex:1}
.toolbar .lbl{font-size:12px;color:var(--mut);margin-left:6px}
#stage{flex:1;position:relative;min-height:0}
#view3d,#sketchView{position:absolute;inset:0}
#view3d canvas{position:absolute;left:0;top:0}
#ov{cursor:grab}#ov:active{cursor:grabbing}
.nogl{padding:40px;color:var(--ko);font-weight:600}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff7e8;border:1px solid #f0c27a;padding:8px 14px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.floating{position:absolute;top:14px;right:14px;width:310px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(20,40,70,.16)}
#planeDlg{width:360px;left:50%;right:auto;transform:translateX(-50%)}
.fl-title{font-weight:700;font-size:15px;margin-bottom:10px}
.planes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.plane-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.plane-btn:hover{border-color:var(--acc);background:#f4f8fd}
.plane-btn svg{width:60px;height:44px}.plane-btn b{font-size:13px}.plane-btn span{font-size:11px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;cursor:pointer}
/* esquisse */
#sketchView{display:flex;flex-direction:column}
.toolbar.sk{background:#fffaf3;border-bottom-color:#f0d8b6}
.skplane{color:var(--acc2);margin-right:8px;font-size:13.5px}
.skbody{flex:1;display:flex;min-height:0}
#skwrap{flex:1;position:relative;min-width:0}
#skc{position:absolute;left:0;top:0;touch-action:none}
#skwarn{position:absolute;top:10px;left:10px;background:#fdecea;border:1px solid #f0b4ae;color:var(--ko);padding:7px 11px;border-radius:7px;font-size:13px}
#skprops{width:250px;flex:none;border-left:1px solid var(--line);padding:6px 12px 14px}
.pp-title{font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.entlist{display:flex;flex-wrap:wrap;gap:4px}
.entbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.entbtn.on{border-color:var(--acc2);color:var(--acc2);background:#fff6ec}
.ptrow{display:flex;align-items:center;gap:4px}.ptrow b{font-size:12px;width:24px;color:var(--mut)}
.ptrow .fld{margin:3px 0}.ptrow .fld input{width:62px}.ptrow .fld em{display:none}.ptrow .fld span{flex:none}
/* modal, toast */
#modal{position:fixed;inset:0;background:rgba(18,30,48,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBox{background:#fff;border-radius:14px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modalBox h3{margin:0 0 10px;color:var(--acc)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center}
.toast{background:#1c2633;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;transition:opacity .4s}
.toast.warn{background:#a8431c}.toast.ok{background:var(--ok)}.toast.out{opacity:0}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}
.help-grid div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:13px}
.help-grid span{color:var(--mut)}
.help-steps{padding-left:20px;line-height:1.7;font-size:13.5px}
body.locked [data-act="new-sketch"],body.locked [data-act="new-file"],body.locked [data-act="open-file"]{opacity:.35;pointer-events:none}
/* ===== missions ===== */
.m-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.m-team{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut)}
.m-team b{color:var(--ink)}
.prog{height:8px;background:#e5ebf3;border-radius:5px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f6db8,#1a8a3a);transition:width .5s}
.m-tabs{display:flex;gap:5px;flex-wrap:wrap}
.m-tab{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--mut);position:relative;font-size:13px}
.m-tab.cur{border-color:var(--acc);color:var(--acc);background:#eaf1fb}
.m-tab.done{background:var(--ok);border-color:var(--ok);color:#fff}
.m-tab.part{background:#fff3df;border-color:#f0c27a;color:#a8641c}
.m-tab.q{width:auto;padding:0 10px}
.m-body{padding:12px 14px 30px}
.m-kicker{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc2)}
.m-title{font-size:19px;font-weight:700;margin:2px 0 6px}
.m-pitch{font-size:13.5px;color:#3a4758;margin:0 0 10px;line-height:1.45}
.tgt{position:relative;height:250px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f4f7fb}
.tgt canvas{position:absolute;left:0;top:0}
.tgt-bar{display:flex;gap:4px;margin:6px 0 10px;align-items:center}
.tgt-bar span{font-size:11.5px;color:var(--mut);margin-left:auto}
.method{border:1px solid var(--line);border-radius:10px;margin:8px 0}
.method summary{padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--acc)}
.method ol{margin:0;padding:2px 14px 10px 32px;font-size:13px;line-height:1.65}
.gd{border:2px solid #f9b13c;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fffaf0}
.gd .gh{display:flex;justify-content:space-between;font-size:12px;color:#92400e}.gd .gt{font-size:13.5px;line-height:1.5;margin:6px 0 8px}
.gd .gt b{color:#1e3a5f}.gd img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block;margin-bottom:6px}
.gd .gdots{display:flex;gap:3px;margin:4px 0 8px}.gd .gdots i{flex:1;height:5px;border-radius:3px;background:#e2e8f0}.gd .gdots i.d{background:#16a34a}.gd .gdots i.c{background:#f9b13c}
.gd .gn{display:flex;justify-content:space-between;gap:8px}
.verify{margin-top:10px}
.res{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--soft)}
.res.ok{background:#e9f6ed;border-color:#a8d8b6}.res.ko{background:#fdf1f0;border-color:#efc4c0}
.res .ln{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.res .ln i{font-style:normal;font-weight:700;width:16px}
.res .ln.g i{color:var(--ok)}.res .ln.b i{color:var(--ko)}
.qbox{margin-top:14px;border:1px solid #d9c9f0;background:#faf7ff;border-radius:10px;padding:10px 12px}
.qbox .qt{font-weight:600;font-size:13.5px;margin-bottom:8px}
.qbox .qrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qbox input{width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-family:Consolas,'Courier New',monospace}
.qbox .unit{color:var(--mut);font-size:13px}
.qopts{display:flex;flex-direction:column;gap:5px}
.qopt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}
.qopt:hover{border-color:#a993d6}.qopt.on{border-color:#6c48b8;background:#efe8fb;color:#4a2b8c;font-weight:600}
.qopt.good{border-color:var(--ok);background:#e9f6ed}.qopt.bad{border-color:var(--ko);background:#fdf1f0}
.qfb{font-size:12.5px;margin-top:6px}.qfb.g{color:var(--ok)}.qfb.b{color:var(--ko)}
.order{display:flex;flex-direction:column;gap:4px}
.order .it{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px}
.order .it b{color:var(--mut);width:16px}.order .it span{flex:1}
.order .it button{border:1px solid var(--line);background:#fff;border-radius:5px;width:26px;height:24px;cursor:pointer}
.pts{float:right;font-size:12px;font-weight:700;color:var(--mut);background:var(--soft);border-radius:20px;padding:2px 9px}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.start-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.start-grid input,.start-grid select{padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit;color:var(--ink)}
.comp{font-size:12.5px;background:var(--soft);border-radius:9px;padding:9px 12px;margin:8px 0;line-height:1.55}
.comp b{color:var(--acc)}
.scoreBig{font-size:42px;font-weight:700;color:var(--acc);text-align:center;margin:6px 0}
table.res-t{width:100%;border-collapse:collapse;font-size:12.5px}
table.res-t th,table.res-t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.res-t th{background:var(--soft);font-weight:600}
.corr{margin-top:10px;border:1px solid #a8d8b6;background:#f2faf4;border-radius:10px;padding:10px 12px;font-size:13px}
.corr h4{margin:0 0 6px;color:var(--ok);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.submit-zone{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
/* calculatrice */
#calc{position:fixed;right:18px;bottom:18px;width:270px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:10px;z-index:40}
#calc .cd{display:flex;gap:6px;margin-bottom:6px}
#calc input{flex:1;font-family:Consolas,'Courier New',monospace;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px}
#calc .co{font-family:Consolas,'Courier New',monospace;text-align:right;font-size:17px;font-weight:600;padding:4px 6px;color:var(--acc);min-height:26px}
#calc .ck{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#calc .ck button{padding:7px 0;border:1px solid var(--line);background:#f7f9fc;border-radius:6px;cursor:pointer;font-family:Consolas,'Courier New',monospace;font-size:12.5px}
#calc .ck button.eq{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (max-width:1560px){.mode-tp .tools .tl,.mode-eval .tools .tl{display:none}}
@media (max-width:1250px){.tools .tl{display:none}}
@media (max-width:1100px){#side{width:210px}#mission{width:320px}#skprops{width:210px}}
@media (max-width:800px){#app{flex-direction:column;height:auto}#mission,#side{width:100%;max-height:none}#work{height:80vh}.eb-copy,.eb-left span{display:none}}

.cote-edit{position:absolute;width:80px;height:30px;border:2px solid var(--acc2);border-radius:6px;text-align:center;font:600 14px Consolas,'Courier New',monospace;color:#b4261a;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5}

#asmPanel{display:none;flex:1;overflow:auto}
body.ws-asm #asmPanel{display:block}body.ws-asm #treeList,body.ws-asm #props,body.ws-asm .part-only{display:none!important}
.pad{padding:2px 12px 8px}.alist{padding:0 8px}
.apart{border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff}
.ah{display:flex;align-items:center;gap:7px;padding:7px 8px;cursor:pointer;font-size:13px}.ah i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ah .grow{flex:1}.x{border:none;background:none;color:var(--mut);cursor:pointer;font-size:13px}.x:hover{color:var(--ko)}
.aedit{padding:2px 10px 10px;border-top:1px dashed var(--line)}.aedit .fld input{width:72px}
.badge{font-size:10.5px;background:#e8eef7;color:var(--acc);border-radius:10px;padding:1px 7px;font-weight:600;font-style:normal}.badge.m{background:#fde8e6;color:var(--ko)}
.ajoint{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:5px 6px;border-bottom:1px dashed var(--line)}.ajoint span{flex:1}
#simDlg{width:330px;max-height:calc(100% - 28px);overflow:auto}
.sim-sec{border-top:1px solid var(--line);padding:8px 0 4px;font-size:13px}.sim-sec>b{display:block;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.chip{background:#eef3fa;border:1px solid #c9d7ea;border-radius:14px;padding:2px 4px 2px 9px;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.chip button{border:none;background:none;cursor:pointer;color:var(--mut)}.chip.load{background:#fdecea;border-color:#f0b4ae;padding-right:9px}
.simres{margin-top:10px;border:1px solid #a8d8b6;background:#f2faf4;border-radius:10px;padding:8px 10px}.simres.bad{background:#fdf1f0;border-color:#efc4c0}
.pv.big b{font-size:15px;color:var(--acc)}
#kinPanel{position:absolute;left:12px;right:12px;bottom:12px;height:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,40,70,.16);display:flex;flex-direction:column;padding:8px 10px}
.kin-h{display:flex;align-items:center;gap:8px;font-size:13px}.kin-h select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12.5px}.kin-h .grow{flex:1}
.kin-c{flex:1;position:relative;min-height:0}.kin-c canvas{position:absolute;left:0;top:0}
#kinRead{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;padding-top:4px}

</style>
</head>
<body class="mode-tp">
<header class="estic-bar">
  <div class="eb-left"><img alt="Logo ESTIC" src="logo_estic.png" style="height:36px"><div><b>Professeur AGOSTINI</b><span>Technologie · ESTIC</span></div></div>
  <div class="eb-title">TP CAO 4e-2 — Matériaux et masse</div>
  <div class="eb-right"><span id="ebExtra"></span><span class="eb-copy">&copy; ESTIC &mdash; Tous droits r&eacute;serv&eacute;s</span></div>
</header>
<div id="app">
  <aside id="mission" class="panel"></aside>
  <aside id="side" class="panel">
    <div class="side-h">Arbre de construction</div>
    <div id="treeList"></div>
    <div id="asmPanel"></div>
    <div id="props">
      <div class="side-h">Propri&eacute;t&eacute;s</div>
      <label class="fld mat"><span>Mat&eacute;riau</span><select id="matSel"></select></label>
      <div id="propVals"></div>
    </div>
  </aside>
  <main id="work">
    <div id="tb3d" class="toolbar">
      <div class="seg hidden" id="wsSeg"><button class="btn on" data-act="ws" data-v="part">Pi&egrave;ce</button><button class="btn" data-act="ws" data-v="asm">Assemblage</button></div>
      <button class="btn primary part-only" data-act="new-sketch"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Nouvelle esquisse</button>
      <button class="btn part-only hidden" data-act="sim-open"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 18V9l6 3 6-6v12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Simulation</button>
      <span class="sep"></span>
      <div class="seg">
        <button class="btn" data-act="view" data-v="iso">Iso</button><button class="btn" data-act="view" data-v="face">Face</button><button class="btn" data-act="view" data-v="dessus">Dessus</button><button class="btn" data-act="view" data-v="droite">Droite</button>
      </div>
      <button class="btn" data-act="fit" title="Ajuster la vue"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="btn" data-act="ortho">Perspective</button>

/* ===== GEOM : modèle, compilation, échantillonnage, comparaison ===== */
const G = (() => {
  const PLANE_NAMES = { '0,0,1': 'Dessus', '0,0,-1': 'Dessous', '0,-1,0': 'Face', '0,1,0': 'Arrière', '1,0,0': 'Droite', '-1,0,0': 'Gauche' };
  function frame(n) {
    const [x, y, z] = n;
    if (z > .5) return { u: [1, 0, 0], v: [0, 1, 0] };
    if (z < -.5) return { u: [1, 0, 0], v: [0, -1, 0] };
    if (y < -.5) return { u: [1, 0, 0], v: [0, 0, 1] };
    if (y > .5) return { u: [-1, 0, 0], v: [0, 0, 1] };
    if (x > .5) return { u: [0, 1, 0], v: [0, 0, 1] };
    return { u: [0, -1, 0], v: [0, 0, 1] };
  }
  function planeName(p) {
    const k = p.n.map(v => Math.round(v)).join(',');
    let nm = PLANE_NAMES[k] || 'Plan';
    if (Math.abs(p.off) > 1e-9) nm += ' (' + fmt(p.off) + ' mm)';
    return nm;
  }
  function fmt(v, d = 2) {
    let s = (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toString();
    return s.replace('.', ',');
  }
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

  /* ---- entités 2D compilées ---- */
  function npolyPts(e) {
    const pts = [], r = e.d / 2, a0 = (e.a || 0) * Math.PI / 180;
    for (let i = 0; i < e.n; i++) { const a = a0 + i * 2 * Math.PI / e.n; pts.push([e.cx + r * Math.cos(a), e.cy + r * Math.sin(a)]); }
    return pts;
  }
  function compileEnt(e) {
    switch (e.t) {
      case 'rect': return { k: 'r', cx: e.x + e.w / 2, cy: e.y + e.h / 2, hx: Math.abs(e.w) / 2, hy: Math.abs(e.h) / 2 };
      case 'circle': return { k: 'c', cx: e.cx, cy: e.cy, r: e.d / 2 };
      case 'oblong': { const a = (e.a || 0) * Math.PI / 180, dx = Math.cos(a) * e.L / 2, dy = Math.sin(a) * e.L / 2;
        return { k: 's', ax: e.cx - dx, ay: e.cy - dy, bx: e.cx + dx, by: e.cy + dy, r: e.d / 2 }; }

    return null;
  }

const MATS = [['PLA', 1.24, 3500, 0.36, 50], ['ABS', 1.04, 2200, 0.35, 40], ['Bois (pin)', 0.50, 11000, 0.30, 40], ['Aluminium', 2.70, 70000, 0.33, 200], ['Acier', 7.85, 210000, 0.30, 235], ['Fonte', 7.20, 100000, 0.26, 200], ['Laiton', 8.50, 100000, 0.34, 200]];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3100);
}
function fmtN(v, d = 1) { return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).replace('.', ','); }

const CAD = {
  model: { features: [] }, hist: [], fut: [], sel: -1, mode: '3d', pending: null, editIdx: -1, editSketchOnly: false,
  locked: false, hooks: [], markers: [], mat: 0, firstFit: true, ws: 'part', pickFor: 'sketch', simShow: 'vm', simField: null,
  init() {
    this.vw = new Viewer($('#gl'), $('#ov'));
    if (!this.vw.ok) { $('#view3d').innerHTML = '<div class="nogl">Ce navigateur ne permet pas l’affichage 3D (WebGL2). Utilise Chrome, Edge ou Firefox à jour.</div>'; }
    this.vw.overlayHooks.push((c, vw) => this.drawMarkers(c, vw));
    this.vw.overlayHooks.push((c, vw) => { if (this.ws === 'asm') ASM.overlay(c, vw); else this.drawSim(c, vw); });
    if (CFG.asm || CFG.mode === 'libre') $('#wsSeg').classList.remove('hidden');
    if (CFG.sim || CFG.mode === 'libre') $('[data-act="sim-open"]').classList.remove('hidden');
    this.sk = new SketchEditor($('#sketchView'), { onChange: () => {} });
    this.vw.onPick = (x, y) => this.onPick(x, y);
    document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { if (b.dataset.act.startsWith('asm-') || b.dataset.act === 'kin-close') ASM.act(b.dataset.act, b); else this.act(b.dataset.act, b, e); } });
    document.addEventListener('keydown', e => this.key(e));
    $('#featDlg').addEventListener('input', () => this.readDlg());
    $('#matSel').innerHTML = MATS.map((m, i) => `<option value="${i}">${m[0]} (${String(m[1]).replace('.', ',')} g/cm³)</option>`).join('');
    $('#matSel').addEventListener('change', e => { this.mat = +e.target.value; this.model.mat = this.mat; this.clearSim(); this.showProps(); this.renderSim(); });
    $('#fileIn').addEventListener('change', e => this.loadFile(e));
    this.vw.setView('iso'); this.vw.fit([0, 0, 0, 60, 40, 20]);
    this.rebuild(true);
  },
  /* ---------- modèle ---------- */
  setModel(m, keepView) {
    this.model = JSON.parse(JSON.stringify(m || { features: [] })); this.hist = []; this.fut = []; this.sel = -1; this.markers = [];
    if (!this.model.features) this.model.features = [];
    this.mat = this.model.mat ?? (CFG.defaultMat ?? 0); $('#matSel').value = this.mat;
    this.simField = null; this.vw.setField(null); ASM.invalidate();
    this.firstFit = !keepView;
    if (this.ws === 'asm' && !this.model.asm) this.setWs('part');
    this.rebuild(true);
    if (this.ws === 'asm') { ASM.enter(); ASM.fit(); } else if (!keepView) this.fitAll();
    this.renderSim();
  },
  partFeatures() { return this.model.features; },
  setWs(w) {
    if (this.mode !== '3d' || this.pending) { toast('Termine d\u2019abord ton esquisse.', 'warn'); return; }
    this.ws = w; document.body.classList.toggle('ws-asm', w === 'asm');
    $$('[data-act="ws"]').forEach(b => b.classList.toggle('on', b.dataset.v === w));
    $('#simDlg').classList.add('hidden'); $('#kinPanel').classList.add('hidden'); this.markers = [];
    if (w === 'asm') { this.vw.setField(null); ASM.enter(); ASM.fit(); }
    else { ASM.stop(); this.vw.setModel(G.compile(this.model)); if (this.simField) this.showField(); this.fitAll(); }
  },
  getModel() { return JSON.parse(JSON.stringify(this.model)); },
  commit() { this.hist.push(JSON.stringify(this.model)); if (this.hist.length > 80) this.hist.shift(); this.fut = []; },
  undo() { if (!this.hist.length || this.locked) return; this.fut.push(JSON.stringify(this.model)); this.model = JSON.parse(this.hist.pop()); this.sel = -1; this.rebuild(); },
  redo() { if (!this.fut.length || this.locked) return; this.hist.push(JSON.stringify(this.model)); this.model = JSON.parse(this.fut.pop()); this.sel = -1; this.rebuild(); },
  rebuild(silent) {
    const feats = this.model.features.slice();
    if (this.pending) { if (this.editIdx >= 0) feats[this.editIdx] = this.pending; else feats.push(this.pending); }
    const C = G.compile({ features: feats });
    this.C = G.compile(this.model);
    clearTimeout(this.rt); this.rt = setTimeout(() => { if (this.ws === 'part') this.vw.setModel(C); }, 10);
    this.renderTree();
    if (!this.pending) {
      this.markers = silent ? this.markers : [];
      clearTimeout(this.at); $('#propVals').classList.add('busy');
      this.at = setTimeout(() => { this.A = G.analyze(this.C); this.showProps(); $('#propVals').classList.remove('busy');
        if (this.firstFit && !this.A.empty) { this.firstFit = false; this.fitAll(); } }, 140);
      if (!silent) { this.clearSim(); this.hooks.forEach(h => h('change')); }
    }
    $('[data-act="undo"]').disabled = !this.hist.length || this.locked; $('[data-act="redo"]').disabled = !this.fut.length || this.locked;
  },
  showProps() {
    const A = this.A, el = $('#propVals');
    if (!A || A.empty) { el.innerHTML = '<div class="muted">Pas encore de solide.</div>'; return; }
    const m = A.vol / 1000 * MATS[this.mat][1];
    el.innerHTML = `<div class="pv"><span>Volume</span><b>${fmtN(A.vol / 1000, 2)} cm³</b></div>
      <div class="pv"><span>Dimensions</span><b>${A.dims.map(d => G.fmt(d, 1)).join(' × ')} mm</b></div>
      <div class="pv"><span>Masse</span><b>${fmtN(m, 1)} g</b></div>`;
  },
  fitAll() { const A = G.analyze(this.C, 20000); this.vw.fit(A.empty ? [0, 0, 0, 60, 40, 20] : A.bbox); },
  /* ---------- arbre ---------- */
  featName(f, i) {
    const n = this.model.features.slice(0, i + 1).filter(g => g.op === f.op).length;
    return (f.op === 'boss' ? 'Bossage ' : 'Enlèvement ') + n;
  },
  renderTree() {
    const L = $('#treeList'), F = this.model.features;
    if (!F.length) { L.innerHTML = '<div class="tree-empty">L’arbre est vide.<br>Commence par <b>Nouvelle esquisse</b>.</div>'; return; }
    L.innerHTML = F.map((f, i) => {
      const depth = f.op === 'cut' && f.thru ? 'à travers tout' : G.fmt(f.depth) + ' mm' + (f.dir === 0 ? ' sym.' : f.dir === -1 ? ' inv.' : '');
      const on = i === this.sel;
      return `<div class="feat ${f.op} ${on ? 'on' : ''} ${f.hidden ? 'hid' : ''}" data-act="sel-feat" data-i="${i}">
        <div class="fic">${f.op === 'boss' ? ICON_BOSS : ICON_CUT}</div>
        <div class="ftx"><b>${this.featName(f, i)}</b><span>Esquisse sur ${G.planeName(f.sketch.plane)} · ${depth}</span></div></div>
        ${on && !this.locked ? `<div class="feat-acts"><button class="btn sm" data-act="edit-sketch" data-i="${i}">Esquisse</button><button class="btn sm" data-act="edit-feat" data-i="${i}">Profondeur</button><button class="btn sm" data-act="hide-feat" data-i="${i}">${f.hidden ? 'Afficher' : 'Masquer'}</button><button class="btn sm danger" data-act="del-feat" data-i="${i}">Supprimer</button></div>` : ''}`;
    }).join('');
  },
  /* ---------- actions ---------- */
  act(a, b, e) {
    const i = +b.dataset.i;
    const editing = ['new-sketch', 'edit-sketch', 'edit-feat', 'del-feat', 'hide-feat', 'new-file', 'open-file', 'sim-run', 'sim-pick'];
    if (this.locked && editing.includes(a)) { toast('Copie rendue : modification impossible.'); return; }
    switch (a) {
      case 'view': this.vw.setView(b.dataset.v); break;
      case 'fit': this.fitAll(); break;
      case 'ortho': this.vw.cam.ortho = !this.vw.cam.ortho; b.classList.toggle('on', this.vw.cam.ortho); b.textContent = this.vw.cam.ortho ? 'Orthogonale' : 'Perspective'; this.vw.req(); break;
      case 'undo': this.undo(); break;
      case 'redo': this.redo(); break;
      case 'new-sketch': if (this.mode !== '3d' || this.pending) return; this.editIdx = -1; this.openPlaneDlg(); break;
      case 'plane': this.choosePlane(b.dataset.p); break;
      case 'plane-face': this.startPick(); break;
      case 'plane-cancel': this.closePlaneDlg(); break;
      case 'sel-feat': this.sel = this.sel === i ? -1 : i; this.renderTree(); break;
      case 'edit-sketch': { const f = this.model.features[i]; this.editIdx = i; this.editSketchOnly = true; this.openSketch(f.sketch.plane, f.sketch.ents, i); break; }
      case 'edit-feat': { const f = this.model.features[i]; this.editIdx = i; this.pending = JSON.parse(JSON.stringify(f)); this.openFeatDlg(); this.rebuild(); break; }
      case 'hide-feat': this.commit(); this.model.features[i].hidden = !this.model.features[i].hidden; this.rebuild(); break;
      case 'del-feat': this.commit(); this.model.features.splice(i, 1); this.sel = -1; this.rebuild(); toast('Fonction supprimée (Ctrl+Z pour annuler)'); break;
      case 'sk-tool': this.sk.setTool(b.dataset.sktool); break;
      case 'sk-snap': this.sk.snap = +b.dataset.v; $$('[data-act="sk-snap"]').forEach(x => x.classList.toggle('on', x === b)); this.sk.draw(); break;
      case 'sk-fit': this.sk.fitView(); break;
      case 'sk-sel': this.sk.sel = i; this.sk.setTool('select'); this.sk.renderProps(); this.sk.draw(); break;
      case 'sk-del': this.sk.del(this.sk.sel); break;
      case 'sk-center': this.sk.center(); break;
      case 'sk-ok': this.sketchDone(); break;
      case 'sk-cancel': this.closeSketch(); break;
      case 'fd-op': this.pending.op = b.dataset.v; if (this.editIdx < 0) this.pending.dir = this.defaultDir(this.pending); this.syncDlg(); this.rebuild(); break;
      case 'fd-dir': this.pending.dir = +b.dataset.v; this.syncDlg(); this.rebuild(); break;
      case 'fd-ok': this.featDone(); break;
      case 'fd-cancel': this.pending = null; $('#featDlg').classList.add('hidden'); this.editIdx = -1; this.rebuild(true); break;
      case 'save-file': this.saveFile(); break;
      case 'open-file': $('#fileIn').click(); break;
      case 'new-file': this.askNew(); break;
      case 'new-yes': this.closeModal(); this.commit(); this.setModel({ features: [] }); this.setWs('part'); break;
      case 'modal-close': this.closeModal(); break;
      case 'help': this.openHelp(); break;
      case 'ws': this.setWs(b.dataset.v); break;
      case 'sim-open': if (this.locked) { toast('Copie rendue : modification impossible.'); return; } $('#simDlg').classList.toggle('hidden'); this.renderSim(); this.vw.req(); break;
      case 'sim-close': $('#simDlg').classList.add('hidden'); this.vw.req(); break;
      case 'sim-pick': this.startPick(b.dataset.k); break;
      case 'sim-unfix': this.simObj().fixed.splice(i, 1); this.clearSim(); this.renderSim(); break;
      case 'sim-mesh': this.simObj().mesh = +b.dataset.v; this.renderSim(); break;
      case 'sim-run': this.runSim(); break;
      case 'sim-show': this.simShow = b.dataset.v; this.showField(); this.renderSim(); break;
    }
  },
  key(e) {
    const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT' || tg.tagName === 'TEXTAREA')) { if (e.key === 'Enter' && this.mode === 'sketch') tg.blur(); return; }
    if (this.mode === 'sketch') { if (this.sk.key(e)) e.preventDefault(); return; }
    if (this.mode === 'pick' && e.key === 'Escape') { this.stopPick(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); this.undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); this.redo(); }
    if (e.key === 'Delete' && this.sel >= 0 && !this.locked && !this.pending) this.act('del-feat', { dataset: { i: this.sel } });
  },
  /* ---------- plan d'esquisse ---------- */
  openPlaneDlg() { $('#planeDlg').classList.remove('hidden'); $('#planeOff').value = '0'; },
  closePlaneDlg() { $('#planeDlg').classList.add('hidden'); },
  choosePlane(p) {
    const off = parseFloat(($('#planeOff').value || '0').replace(',', '.')) || 0;
    const n = { top: [0, 0, 1], front: [0, -1, 0], right: [1, 0, 0] }[p];
    this.closePlaneDlg(); this.openSketch({ n, off }, [], -1);
  },
  startPick(kind = 'sketch') {
    if (!this.C.length) { toast('Il n\u2019y a pas encore de solide : choisis un plan de base.'); return; }
    this.pickFor = kind;
    this.closePlaneDlg(); this.mode = 'pick'; this.vw.pickMode = true;
    const what = kind === 'fix' ? 'la face <b>encastr\u00e9e</b>' : kind === 'load' ? 'la face qui re\u00e7oit <b>l\u2019effort</b>' : 'une <b>face plane</b> du solide';
    $('#banner').innerHTML = 'Clique sur ' + what + ' <button class="btn sm" data-act="plane-cancel-pick">Annuler</button>'; $('#banner').classList.remove('hidden');
    $('#banner [data-act]').addEventListener('click', () => this.stopPick());
  },
  stopPick() { this.mode = '3d'; this.vw.pickMode = false; $('#banner').classList.add('hidden'); },
  onPick(x, y) {
    const h = this.vw.pick(x, y);
    if (!h) { toast('Aucune face ici.'); return; }
    const k = h.n.map(Math.abs), ax = k.indexOf(Math.max(...k));
    if (k[ax] < 0.995) { toast('Face courbe : choisis une face plane.', 'warn'); return; }
    const n = [0, 0, 0]; n[ax] = Math.sign(h.n[ax]);
    let off = G.dot(h.p, n); const rb = G.roughBox(this.C);
    if (rb) { let best = null; for (const c of rb.cand[ax]) { const o = c * n[ax]; if (Math.abs(o - off) < 0.08 && (best === null || Math.abs(o - off) < Math.abs(best - off))) best = o; } if (best !== null) off = best; }
    off = Math.round(off * 1000) / 1000;
    this.stopPick();
    if (this.pickFor === 'sketch') { this.openSketch({ n, off }, [], -1); return; }
    const S = this.simObj(), pl = { n, off, p: h.p.map(v => Math.round(v * 100) / 100) };
    if (this.pickFor === 'fix') { if (!S.fixed.some(f => f.n.join() === n.join() && Math.abs(f.off - off) < 1e-3)) S.fixed.push(pl); }
    else S.load = { ...pl, F: S.load ? S.load.F : 100, dir: S.load ? S.load.dir : [0, 0, -1] };
    this.clearSim(); this.renderSim(); this.vw.req();
  },
  /* ---------- esquisse ---------- */
  openSketch(plane, ents, idx) {
    this.mode = 'sketch';
    const C = G.compile({ features: this.model.features.filter((f, j) => idx < 0 || j < idx) });
    $('#view3d').classList.add('hidden'); $('#sketchView').classList.remove('hidden'); $('#tb3d').classList.add('hidden');
    $('#skPlane').textContent = 'Esquisse sur ' + G.planeName(plane);
    this.sk.open(plane, ents, C);
  },
  closeSketch() {
    this.mode = '3d'; this.editIdx = -1; this.editSketchOnly = false;
    $('#view3d').classList.remove('hidden'); $('#sketchView').classList.add('hidden'); $('#tb3d').classList.remove('hidden');
    this.vw.resize();
  },
  sketchDone() {
    const ents = this.sk.ents;
    if (!ents.length) { toast('Dessine au moins un contour.', 'warn'); return; }
    const plane = this.sk.plane;
    if (this.editSketchOnly && this.editIdx >= 0) {
      this.commit(); this.model.features[this.editIdx].sketch.ents = JSON.parse(JSON.stringify(ents));
      this.closeSketch(); this.rebuild(); toast('Esquisse modifiée'); return;
    }
    const idx = this.editIdx; this.closeSketch(); this.editIdx = idx;
    const hasBoss = this.model.features.some(f => f.op === 'boss' && !f.hidden);
    this.pending = { id: 'f' + Date.now(), op: 'boss', sketch: { plane, ents: JSON.parse(JSON.stringify(ents)) }, depth: 10, dir: 1, thru: false };
    if (hasBoss && this.materialBelow(this.pending) === 'below' && this.coverage(this.pending) > 0.9) this.pending.op = 'cut';
    this.pending.dir = this.defaultDir(this.pending);
    if (this.pending.op === 'cut') this.pending.thru = true;
    this.openFeatDlg(); this.rebuild();
  },
  materialBelow(f) {
    const pl = f.sketch.plane, fr = G.frame(pl.n), b = G.entBounds(f.sketch.ents[0]);
    const s = (b[0] + b[2]) / 2, t = (b[1] + b[3]) / 2;
    const P = w => [0, 1, 2].map(i => fr.u[i] * s + fr.v[i] * t + pl.n[i] * w);
    if (G.inside(this.C, ...P(pl.off - 0.05))) return 'below';
    if (G.inside(this.C, ...P(pl.off + 0.05))) return 'above';
    return 'none';
  },
  coverage(f) {
    // part des contours entièrement posés sur de la matière (pour proposer un enlèvement)
    const pl = f.sketch.plane, fr = G.frame(pl.n); let tot = 0, ins = 0;
    for (const e of f.sketch.ents) { const b = G.entBounds(e), c = G.compileEnt(e);
      for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { const s = b[0] + (i + .5) / 6 * (b[2] - b[0]), t = b[1] + (j + .5) / 6 * (b[3] - b[1]);
        if (!G.in2(c, s, t)) continue; tot++;
        if (G.inside(this.C, ...[0, 1, 2].map(k => fr.u[k] * s + fr.v[k] * t + pl.n[k] * (pl.off - 0.05)))) ins++; } }
    return tot ? ins / tot : 0;
  },
  defaultDir(f) {
    const m = this.materialBelow(f);
    if (f.op === 'cut') return m === 'above' ? 1 : -1;
    return m === 'above' ? -1 : 1;
  },
  /* ---------- dialogue fonction ---------- */
  openFeatDlg() {
    const d = $('#featDlg'); d.classList.remove('hidden');
    $('#fdDepth').value = String(this.pending.depth).replace('.', ','); $('#fdThru').checked = !!this.pending.thru;
    const hasBoss = this.model.features.some((f, j) => f.op === 'boss' && j !== this.editIdx);
    $('[data-act="fd-op"][data-v="cut"]').disabled = !hasBoss;
    if (!hasBoss) this.pending.op = 'boss';
    this.syncDlg();
  },
  syncDlg() {
    const p = this.pending;
    $$('[data-act="fd-op"]').forEach(b => b.classList.toggle('on', b.dataset.v === p.op));
    $$('[data-act="fd-dir"]').forEach(b => b.classList.toggle('on', +b.dataset.v === p.dir));
    $('#fdThruRow').classList.toggle('hidden', p.op !== 'cut');
    const th = p.op === 'cut' && p.thru; $('#fdDepthRow').classList.toggle('dis', th); $('#fdDirRow').classList.toggle('dis', th);
    $('#fdTitle').textContent = p.op === 'boss' ? 'Bossage (ajout de matière)' : 'Enlèvement de matière';
  },
  readDlg() {
    if (!this.pending) return;
    const v = parseFloat($('#fdDepth').value.replace(',', '.'));
    if (isFinite(v) && v > 0) this.pending.depth = v;
    this.pending.thru = $('#fdThru').checked; this.syncDlg(); this.rebuild();
  },
  featDone() {
    const p = this.pending; if (!p) return;
    this.commit();
    if (this.editIdx >= 0) this.model.features[this.editIdx] = p; else this.model.features.push(p);
    this.pending = null; this.editIdx = -1; $('#featDlg').classList.add('hidden');
    this.sel = -1; this.rebuild();
  },
  /* ---------- marqueurs d'erreur ---------- */
  setMarkers(m) { this.markers = m || []; this.vw.req(); },
  drawMarkers(c, vw) {
    if (!this.markers.length) return;
    c.save();
    for (const P of this.markers) { const p = vw.project(P); if (!p) continue;
      c.fillStyle = 'rgba(220,40,40,.22)'; c.strokeStyle = 'rgba(200,30,30,.85)'; c.lineWidth = 2;
      c.beginPath(); c.arc(p[0], p[1], 13, 0, 7); c.fill(); c.stroke(); }
    c.restore();
  },
  /* ---------- simulation ---------- */
  simObj() { if (!this.model.sim) this.model.sim = { fixed: [], load: null, mesh: 4000, res: null }; return this.model.sim; },
  clearSim() { if (this.model.sim && this.model.sim.res) { this.model.sim.res = null; } if (this.simField) { this.simField = null; this.vw.setField(null); } this.renderSim(); },
  hash() { return JSON.stringify(this.model.features.filter(f => !f.hidden)); },
  renderSim() {
    const d = $('#simDlg'); if (!d || d.classList.contains('hidden')) return;
    const S = this.simObj(), M = MATS[this.mat], pn = p => G.planeName(p);
    const dirs = [['0,0,-1', '−Z (vers le bas)'], ['0,0,1', '+Z (vers le haut)'], ['-1,0,0', '−X'], ['1,0,0', '+X'], ['0,-1,0', '−Y'], ['0,1,0', '+Y']];
    let h = `<div class="fl-title">Simulation : résistance de la pièce</div>
      <div class="comp" style="margin:0 0 8px">${M[0]} · E = ${M[2].toLocaleString('fr-FR')} MPa · Re = ${M[4]} MPa<br><span class="muted">Change le matériau dans Propriétés.</span></div>
      <div class="sim-sec"><b>1. Encastrement</b><div class="chips">${S.fixed.map((f, i) => `<span class="chip">${pn(f)}<button data-act="sim-unfix" data-i="${i}">✕</button></span>`).join('') || '<span class="muted">aucune face</span>'}</div>
        <button class="btn sm" data-act="sim-pick" data-k="fix">+ Face encastrée</button></div>
      <div class="sim-sec"><b>2. Effort</b><div class="chips">${S.load ? `<span class="chip load">${pn(S.load)}</span>` : '<span class="muted">aucune face</span>'}</div>
        <button class="btn sm" data-act="sim-pick" data-k="load">${S.load ? 'Changer la face chargée' : 'Choisir la face chargée'}</button>
        ${S.load ? `<label class="fld"><span>Intensité F</span><input id="simF" value="${String(S.load.F).replace('.', ',')}"><em>N</em></label>
        <label class="fld"><span>Direction</span><select id="simDir" style="width:150px">${dirs.map(o => `<option value="${o[0]}" ${o[0] === S.load.dir.join(',') ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>` : ''}</div>

    this.profOk = true;
    CAD.modal(`<h3>Espace professeur</h3><div class="row2" style="justify-content:flex-start"><button class="btn primary" data-act="prof-res">Résultats de la classe</button>
      <button class="btn" data-act="prof-corr" ${this.submitted ? '' : 'disabled'}>Afficher la correction sur ce poste</button></div>
      ${this.submitted ? '' : '<p class="muted">La correction n’est disponible qu’après la remise de la copie.</p>'}<div id="profRes"></div><div class="row2"><button class="btn" data-act="modal-close">Fermer</button></div>`);
  },
  profResults() {
    if (!this.profOk) return;
    $('#profRes').innerHTML = '<p class="muted">Chargement…</p>';
    fetch(FB_EVAL + (CFG.fbEvalPath || CFG.fbNode) + '.json').then(r => r.json()).then(d => {
      const keysOrd = this.detKeys();
      const rows = Object.values(d || {}).filter(r => r && r.nom).map(r => ({ nom: r.nom + (r.prenom ? ' ' + r.prenom : ''), classe: r.classe, note: r.note20 ?? r.note,
        details: r.details || (r.reponses ? Object.fromEntries(Object.values(r.reponses).map((v, i) => [keysOrd[i] || 'R' + (i + 1), v])) : {}) }))
        .sort((a, b) => (a.classe + a.nom).localeCompare(b.classe + b.nom));
      if (!rows.length) { $('#profRes').innerHTML = '<p class="muted">Aucune copie reçue.</p>'; return; }
      const keys = [...new Set(rows.flatMap(r => Object.keys(r.details || {})))];
      $('#profRes').innerHTML = `<p class="muted">${rows.length} copie(s) · moyenne ${fmtN(rows.reduce((a, r) => a + r.note, 0) / rows.length, 2)} / 20</p>
        <div style="overflow:auto"><table class="res-t"><tr><th>Classe</th><th>Élève</th><th>Note</th>${keys.map(k => `<th>${k}</th>`).join('')}</tr>
        ${rows.map(r => `<tr><td>${esc(r.classe)}</td><td>${esc(r.nom)}</td><td><b>${fmtN(r.note, 2)}</b></td>${keys.map(k => `<td>${r.details && r.details[k] != null ? fmtN(r.details[k], 2) : ''}</td>`).join('')}</tr>`).join('')}</table></div>`;
    }).catch(() => { $('#profRes').innerHTML = '<p class="muted">Connexion à la base impossible.</p>'; });
  }
};

/* ===== calculatrice scientifique ===== */
const Calc = {
  deg: true,
  toggle() {
    const el = $('#calc'); if (!el.classList.contains('hidden')) { el.classList.add('hidden'); return; }
    if (!el.innerHTML) {
      const K = ['sin(', 'cos(', 'tan(', '√(', '^', 'asin(', 'acos(', 'atan(', '(', ')', '7', '8', '9', '/', 'π', '4', '5', '6', '*', 'C', '1', '2', '3', '-', '⌫', '0', ',', 'DEG', '+', '='];
      el.innerHTML = `<div class="cd"><input id="cIn" placeholder="ex : 26*cos(45)"><button class="btn sm" data-act="calc">Fermer</button></div><div class="co" id="cOut"></div>
        <div class="ck">${K.map(k => `<button data-ck="${k}" class="${k === '=' ? 'eq' : ''}">${k}</button>`).join('')}</div>`;
      el.addEventListener('click', e => { const b = e.target.closest('[data-ck]'); if (!b) return; this.key(b.dataset.ck, b); });
      $('#cIn').addEventListener('keydown', e => { if (e.key === 'Enter') this.eval(); });
    }
    el.classList.remove('hidden');
  },
  key(k, b) {
    const i = $('#cIn');
    if (k === '=') return this.eval();
    if (k === 'C') { i.value = ''; $('#cOut').textContent = ''; return; }
    if (k === '⌫') { i.value = i.value.slice(0, -1); return; }
    if (k === 'DEG' || k === 'RAD') { this.deg = !this.deg; b.textContent = this.deg ? 'DEG' : 'RAD'; b.dataset.ck = b.textContent; return; }
    i.value += k; i.focus();
  },
  eval() {
    let s = $('#cIn').value.replace(/,/g, '.').replace(/π/g, '(PI)').replace(/√/g, 'sqrt').replace(/\^/g, '**').replace(/×/g, '*');
    if (/[^0-9+\-*/().\sA-Za-z]/.test(s) || /[A-Za-z]+/g.test(s.replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|ln|log|PI)\b/g, ''))) { $('#cOut').textContent = 'Erreur'; return; }
    const k = this.deg ? Math.PI / 180 : 1;
    const env = { sin: x => Math.sin(x * k), cos: x => Math.cos(x * k), tan: x => Math.tan(x * k), asin: x => Math.asin(x) / k, acos: x => Math.acos(x) / k, atan: x => Math.atan(x) / k, sqrt: Math.sqrt, ln: Math.log, log: Math.log10, PI: Math.PI };
    try { const v = Function(...Object.keys(env), 'return (' + s + ');')(...Object.values(env)); $('#cOut').textContent = isFinite(v) ? String(Math.round(v * 1e6) / 1e6).replace('.', ',') : 'Erreur'; }
    catch (_) { $('#cOut').textContent = 'Erreur'; }
  }
};
window.addEventListener('DOMContentLoaded', () => { CAD.init(); MS.init(); });
