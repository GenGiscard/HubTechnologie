<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier 3D</title>
<style>
:root{--bleu:#1e3a5f;--or:#f9b13c;--bd:#dbe3ee;--fond:#eef3f9}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;color:#0f172a;background:var(--fond)}
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bleu);color:#fff}
header .lg{font-weight:800;letter-spacing:.5px;background:var(--or);color:var(--bleu);padding:4px 9px;border-radius:7px;font-size:13px}
header h1{font-size:17px;margin:0;font-weight:700}header .sp{flex:1}header #who{font-size:13px;opacity:.85}
.btn{border:1px solid var(--bd);background:#fff;color:#0f172a;border-radius:8px;padding:7px 12px;font:600 13px 'Segoe UI',sans-serif;cursor:pointer}
.btn:hover{border-color:#94a3b8}.btn.prim{background:var(--or);border-color:var(--or);color:#1e293b}.btn:disabled{opacity:.4;cursor:default}
header .btn{background:#ffffff1a;color:#fff;border-color:#ffffff33}header .btn.prim{background:var(--or);color:var(--bleu)}
#app{display:grid;grid-template-columns:380px 1fr 250px;grid-template-rows:1fr auto;height:calc(100% - 52px)}
#side{grid-column:1;grid-row:1/3;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 4px}
.tab{border:1px solid var(--bd);background:#f8fafc;border-radius:7px;padding:5px 9px;font:600 12px 'Segoe UI';cursor:pointer;color:#334155}
.tab.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}.tab.ok{box-shadow:inset 0 -3px 0 #16a34a}.tab.lock{opacity:.45}
#prog{font-size:12px;color:#64748b;padding:2px 14px 6px}
#mis{flex:1;overflow:auto;padding:4px 16px 18px}
#mis h2{margin:4px 0 4px;font-size:19px;color:var(--bleu)}#mis h3{font-size:14px;margin:14px 0 6px;color:var(--bleu)}
.num{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#b45309}
.pitch{margin:0 0 10px;color:#334155;font-size:14px}
.tpop{position:absolute;inset:0;background:#fffaf0f0;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:12px;animation:tpIn .18s ease-out}
.tpop>div{background:#fff;border:2px solid #16a34a;border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px #0002}
.tpop b{color:#15803d;font-size:14px}.tpop p{margin:6px 0 10px;font-size:14px;line-height:1.4}.tpop .btn{width:100%}
@keyframes tpIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.tuto{position:relative;border:2px solid var(--or);border-radius:12px;padding:10px 12px;background:#fffaf0}
.tuto .th{font-size:12px;color:#92400e}.tuto .tt{font-size:14.5px;margin:6px 0 8px;line-height:1.4}
.tuto .tt b{color:var(--bleu)}.tuto .tt kbd{background:#1e293b;color:#fff;border-radius:4px;padding:0 5px;font-size:12px}
.ti{width:100%;border-radius:8px;border:1px solid var(--bd);cursor:zoom-in;display:block;margin-bottom:6px}
.tdots{display:flex;gap:4px;margin:4px 0 8px}.tdots i{flex:1;height:5px;border-radius:3px;background:#e2e8f0}.tdots i.d{background:#16a34a}.tdots i.c{background:var(--or)}
.tn{display:flex;justify-content:space-between;gap:8px}
.tests{list-style:none;margin:0;padding:0}.tests li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 0;border-bottom:1px dashed #e2e8f0}
.ck{width:16px;height:16px;border-radius:50%;border:2px solid #cbd5e1;flex:none;margin-top:1px}
.tests li.good .ck{background:#16a34a;border-color:#16a34a}.tests li.bad .ck{background:#e5484d;border-color:#e5484d}
.aide{margin-top:10px;font-size:13px;background:#f1f5f9;border-radius:8px;padding:6px 10px}.aide summary{cursor:pointer;font-weight:600;color:var(--bleu)}
.mbtns{margin-top:12px}.mbtns .btn{width:100%;padding:10px;font-size:14px}
.win{margin-top:10px;background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:10px;text-align:center}.win .btn{margin-top:8px}
.lose{margin-top:10px;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:10px;font-size:13px}
#viewbox{grid-column:2;grid-row:1;position:relative;min-height:0;min-width:0}
#view{position:absolute;inset:0}#view canvas{display:block}
.vbtn{position:absolute;top:10px;left:10px;display:flex;gap:5px}.vbtn .btn{padding:5px 9px;font-size:12px;background:#ffffffd9}.vbtn .btn.on{background:var(--bleu);color:#fff}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}#labels span{position:absolute;left:0;top:0;font:600 11px 'Segoe UI';background:#1e3a5fe6;color:#fff;padding:1px 5px;border-radius:5px;white-space:nowrap}#labels span.ok{background:#16a34ae6}#labels span.on{background:var(--or);color:#1e293b}#labels span.hid{display:none}
#curvewrap{position:absolute;left:10px;right:10px;bottom:10px;height:120px;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px #0003}
#curve{width:100%;height:100%;display:block}
#bonep{background:#fff;border-left:1px solid var(--bd);padding:12px;overflow:auto;grid-column:3;grid-row:1}
.ph{font-weight:700;color:var(--bleu);font-size:14px;margin-bottom:6px}
.muted{color:#64748b;font-size:12.5px;line-height:1.4}
.sl{display:grid;grid-template-columns:72px 1fr 46px;gap:6px;align-items:center;font-size:12px;margin:6px 0}.sl b{text-align:right;font-size:12px}
.sl input{width:100%}
.bb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bb .btn{flex:1;padding:6px 8px;font-size:12px}
.jl{display:flex;flex-wrap:wrap;gap:4px}.j{font-size:11.5px;border:1px solid var(--bd);border-radius:6px;padding:3px 6px;background:#f8fafc}
.j.sel,.j.jr{cursor:pointer}.j.on{background:var(--or);border-color:var(--or)}.j.ok{background:#dcfce7;border-color:#86efac}.j.k{box-shadow:inset 0 -2px 0 #1f6feb}
.hl{display:block;font-size:12.5px;margin:10px 0 6px}
.pr{display:block;font-size:12.5px;margin:8px 0}.pr select{display:block;width:100%;margin-top:3px;padding:4px;border-radius:6px;border:1px solid var(--bd)}
#tlwrap{grid-column:2/4;grid-row:2;background:#fff;border-top:1px solid var(--bd);padding:8px 10px}
.tlc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px}.tlc .btn{padding:5px 10px;font-size:12px}
.tlc select{padding:4px;border-radius:6px;border:1px solid var(--bd)}#tlt{font-weight:700;color:#e5484d;min-width:52px}
#tl{width:100%;height:120px;display:block;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
#modal{position:fixed;inset:0;background:#0f172a8c;display:none;align-items:center;justify-content:center;z-index:50}#modal.on{display:flex}
.box{background:#fff;border-radius:14px;padding:20px 22px;width:400px;max-width:92vw}.box.big{width:900px}
.box h3{margin:4px 0 8px;color:var(--bleu)}.box label{display:block;font-size:13px;margin:8px 0}.box input,.box select{width:100%;padding:7px;border:1px solid var(--bd);border-radius:7px;font-size:14px;margin-top:3px}
.box .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.err{color:#dc2626;font-size:13px;min-height:16px}
.box>.btn.prim{width:100%;margin-top:6px;padding:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;transition:.3s;z-index:60;pointer-events:none}#toast.on{transform:translateX(-50%)}
</style>
<script>/*THREE*/</script>
</head><body>
<header><span class="lg">ESTIC</span><h1 id="ttl">Atelier 3D</h1><span class="sp"></span><span id="who"></span>
<button class="btn" id="aide">Comment ça marche ?</button><button class="btn prim" id="rendre">Rendre mon TP</button><button class="btn" id="prof">Prof</button></header>
<div id="app">
 <aside id="side"><div id="tabs"></div><div id="prog"></div><div id="mis"></div></aside>
 <div id="viewbox"><div id="view"></div><div id="labels"></div>
  <div class="vbtn"><button class="btn" data-view="face">Face</button><button class="btn" data-view="cote">Côté</button><button class="btn" data-view="trois">3/4</button><button class="btn on" id="sk">Squelette</button></div>
  <div id="curvewrap" style="display:none"><canvas id="curve"></canvas></div></div>
 <div id="bonep"></div>
 <div id="tlwrap"><div class="tlc"><button class="btn prim" id="play">Lire</button><button class="btn" id="t0">Début</button><span id="tlt">0,00 s</span>
  <button class="btn prim" id="kb">Clé sur l'os (I)</button><button class="btn" id="kall">Clé tout le corps</button><button class="btn" id="kdel">Supprimer la clé</button>
  <span class="sp" style="flex:1"></span>Durée <select id="dur"><option value="1">1 s</option><option value="1.5">1,5 s</option><option value="2">2 s</option><option value="3">3 s</option><option value="4">4 s</option></select>
  Entre les clés <select id="interp"><option value="lisse">Lisse</option><option value="lineaire">Linéaire</option></select>
  <label><input type="checkbox" id="loop" checked> En boucle</label></div><canvas id="tl"></canvas></div>
</div>
<div id="modal"></div><div id="toast"></div>
<script>/*CFG*/</script>
<script>/*ENGINE*/</script>
</body></html>
