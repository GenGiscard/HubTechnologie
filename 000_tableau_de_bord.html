<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — résultats des évaluations · ESTIC</title><style>
:root{--acc:#0e7490;--accf:#155e75;--fond:#F8F4EC;--encre:#3f3a34;--ok:#16a34a;--moy:#f59e0b;--ko:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--fond);color:var(--encre);display:flex;flex-direction:column;align-items:center}

.estic-bar{width:100%;display:flex;align-items:center;gap:14px;background:#1e293b;border-bottom:3px solid var(--neon);padding:8px 20px}

.estic-bar img{height:36px}

.estic-bar .id b{color:var(--neon);font-size:14px}

.estic-bar .id span{display:block;font-size:11px;color:#94a3b8}

.estic-bar .copy{margin-left:auto;font-size:11px;color:#94a3b8}
main{width:min(1180px,100%);padding:14px 14px 50px}
h1{font-size:25px;color:var(--accf);text-align:center;margin:14px 0 4px}
.sous{text-align:center;color:#8a8378;font-size:13.5px;margin-bottom:14px}
#login{background:#fff;border:1px solid #eee4d0;border-radius:16px;padding:22px;max-width:420px;margin:30px auto;text-align:center}
#login input{width:100%;padding:11px;border:1px solid #d8cdb4;border-radius:10px;font-size:16px;margin:10px 0;text-align:center}
.btn{border:none;border-radius:11px;background:var(--acc);color:#fff;font-weight:900;font-size:15px;padding:11px 20px;cursor:pointer}
.btn.sec{background:#e7dcc4;color:var(--encre)}
#appli{display:none}
.filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtres select,.filtres input{padding:9px 12px;border:1px solid #d8cdb4;border-radius:10px;font-size:14px;font-family:inherit}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid #eee4d0;border-radius:14px;padding:12px 18px;min-width:130px}
.stat b{display:block;font-size:24px;color:var(--accf)}
.stat span{font-size:12.5px;color:#8a8378}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #f0e9db}
th{background:#f3ecdd;color:var(--accf);font-size:12.5px;cursor:pointer;user-select:none}
th:hover{background:#e9dfc8}
tr:hover td{background:#fbf8f1}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff}
.note{font-weight:900}
.jauge{height:7px;background:#eee4d0;border-radius:99px;overflow:hidden;min-width:70px}
.jauge div{height:100%}
.vide{text-align:center;color:#8a8378;padding:26px;font-size:14.5px}
.lien{color:var(--acc);text-decoration:none;font-weight:700}
.lien:hover{text-decoration:underline}
</style></head><body>
<div class="estic-bar">
 <img alt="Logo ESTIC" src="logo_estic.png">
 <div class="id"><b>Professeur AGOSTINI</b><span>Technologie · ESTIC</span></div>
 <div class="copy">© ESTIC — Tous droits réservés</div>
</div>
<main>
<h1>Tableau de bord des évaluations</h1>
<div class="sous">Toutes les séquences · résultats consolidés depuis Firebase</div>

<div id="login">
 <p style="font-size:14.5px">Espace réservé à l’enseignant.</p>
 <input id="mdp" type="password" placeholder="mot de passe" autocomplete="off">
 <button class="btn" id="entrer">Accéder</button>
 <div id="err" style="color:var(--ko);font-size:13px;margin-top:8px;min-height:18px"></div>
</div>

<div id="appli">
 <div class="filtres">
 <select id="fNiv"><option value="">Tous les niveaux</option><option>5e</option><option>4e</option><option>3e</option></select>
 <select id="fSeq"><option value="">Toutes les séquences</option></select>
 <select id="fClasse"><option value="">Toutes les classes</option></select>
 <input id="fNom" placeholder="rechercher un élève…" style="flex:1;min-width:180px">
 <button class="btn sec" id="rafraichir">Rafraîchir</button>
 <button class="btn sec" id="csv">Exporter CSV</button>
 </div>
 <div class="stats" id="stats"></div>
 <div id="etat" class="vide">Chargement des résultats…</div>
 <table id="tab" style="display:none">
 <thead><tr>
 <th data-tri="nom">Élève</th><th data-tri="classe">Classe</th><th data-tri="seq">Séquence</th>
 <th data-tri="niv">Niveau</th><th data-tri="note">Note /20</th><th>Réussite</th>
 <th data-tri="duree">Durée</th><th data-tri="date">Date</th>
 </tr></thead><tbody id="corps"></tbody>
 </table>
</div>
</main>
<script>

const BASE='https://evaluation-bloc-default-rtdb.europe-west1.firebasedatabase.app/evaluations/';
const MDP='Agostini2025';
const EVALS=[
 {

 },

 },

 },
 {

 },
 {
  "f": "04_evaluation_besoin.html",
  "fb": "besoin_5e",

 },
 {
  "f": "04_evaluation_velo.html",
  "fb": "velo_5e",

 },
 {
  "f": "04_evaluation_energies.html",

 },
 {
  "f": "04_evaluation_eau.html",

 },
 {
  "f": "04_evaluation_meteo.html",
  "fb": "meteo_5e",

 },
 {

 },
 {
  "f": "04_evaluation_auto.html",

 },
 {
  "f": "04_evaluation_aero.html",

  "niv": "4e"
 },
 {

];
const ERREURS=new Set();
let DONNEES=[], tri={col:'date',sens:-1};
document.getElementById('entrer').addEventListener('click',connexion);
document.getElementById('mdp').addEventListener('keydown',e=>{ if(e.key==='Enter')connexion(); });
function connexion(){
 if(document.getElementById('mdp').value!==MDP){
 document.getElementById('err').textContent='Mot de passe incorrect.'; return;
 }
 document.getElementById('login').style.display='none';
 document.getElementById('appli').style.display='block';
 const s=document.getElementById('fSeq');
 EVALS.forEach(e=>{ const o=document.createElement('option'); o.value=e.fb; o.textContent=e.titre+' ('+e.niv+')'; s.appendChild(o); });
 charger();
}
async function charger(){
 document.getElementById('etat').textContent='Chargement des résultats…';
 document.getElementById('etat').style.display='block';
 document.getElementById('tab').style.display='none';
 DONNEES=[]; ERREURS.clear();
 const lots=await Promise.all(EVALS.map(async ev=>{
 try{
 const r=await fetch(BASE+ev.fb+'.json');
 const j=await r.json();
 if(j && typeof j==='object' && j.error){ ERREURS.add(j.error); return []; }
 if(!r.ok){ ERREURS.add('HTTP '+r.status); return []; }
 if(!j) return [];
 return Object.entries(j)
 .filter(([,v])=>v && typeof v==='object' && (v.nom!==undefined||v.classe!==undefined))
 .map(([cle,v])=>({
 cle, seq:ev.titre, fb:ev.fb, niv:ev.niv, fichier:ev.f,
 nom:((v.nom||'')+' '+(v.prenom||'')).trim()||'(anonyme)',
 abandon:v.statut==='abandon',
 classe:v.classe||'—',
  note:parseFloat(v.note20!==undefined?v.note20:v.note)||0,
  bonus:parseFloat(v.bonus)||0,
 kahoot:String(v.bonus_eleves||''),
 score:v.score||0,
 duree:v.duree_s?Math.floor(v.duree_s/60)+' min '+String(v.duree_s%60).padStart(2,'0'):(v.duree||''),
 /* ts sert au TRI : trier le texte « jj/mm/aaaa » rangeait par jour du mois,
    pas chronologiquement. date sert à l'AFFICHAGE, heure comprise. */
 ts:v.date?(Date.parse(v.date)||0):0,
 date:v.date?new Date(v.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):''
 }));
 }catch(e){ return []; }
 }));
 lots.forEach(l=>DONNEES=DONNEES.concat(l));
 afficher();
}
function filtres(){
 const n=document.getElementById('fNiv').value, s=document.getElementById('fSeq').value,
 c=document.getElementById('fClasse').value, q=document.getElementById('fNom').value.toLowerCase();
 return DONNEES.filter(d=> (!n||d.niv===n) && (!s||d.fb===s) && (!c||d.classe===c) && (!q||d.nom.toLowerCase().includes(q)));
}
function afficher(){
 const classes=[...new Set(DONNEES.map(d=>d.classe))].filter(c=>c&&c!=='—').sort();
 const sc=document.getElementById('fClasse'), av=sc.value;
 sc.innerHTML='<option value="">Toutes les classes</option>'+classes.map(c=>'<option>'+c+'</option>').join('');
 sc.value=av;
 const L=filtres();
 const corps=document.getElementById('corps');
 const stats=document.getElementById('stats');
 if(!DONNEES.length){
 document.getElementById('etat').innerHTML = ERREURS.size
  ? '<b style="color:#dc2626">Lecture refusée par Firebase</b><br>Message renvoyé : « '+[...ERREURS].join(' / ')+
    ' ».<br>Ajoute une règle autorisant la lecture du chemin /evaluations dans la console Firebase.'
  : 'Aucun résultat pour l’instant.<br>Les résultats apparaîtront ici dès qu’un élève aura terminé une évaluation.';
 document.getElementById('etat').style.display='block';
 stats.innerHTML=''; return;
 }
 document.getElementById('etat').style.display='none';
 document.getElementById('tab').style.display='table';
 const moy=L.length? L.reduce((s,d)=>s+d.note,0)/L.length : 0;
 const reussite=L.length? L.filter(d=>d.note>=10).length/L.length*100 : 0;
 const seqs=new Set(L.map(d=>d.fb)).size;
 stats.innerHTML=
 '<div class="stat"><b>'+L.length+'</b><span>copies</span></div>'+
 '<div class="stat"><b>'+moy.toFixed(1).replace('.',',')+'</b><span>moyenne /20</span></div>'+
 '<div class="stat"><b>'+Math.round(reussite)+' %</b><span>au-dessus de 10</span></div>'+
 '<div class="stat"><b>'+seqs+'</b><span>séquences évaluées</span></div>'+
 '<div class="stat"><b>'+new Set(L.map(d=>d.nom)).size+'</b><span>élèves</span></div>';
 L.sort((a,b)=>{
 const k= tri.col==='date' ? 'ts' : tri.col;   /* la colonne Date trie sur l'horodatage */
 const x=a[k], y=b[k];
 if(typeof x==='number') return (x-y)*tri.sens;
 return String(x).localeCompare(String(y))*tri.sens;
 });
 corps.innerHTML=L.map(d=>{
 const coul = d.note>=14?'var(--ok)':(d.note>=10?'var(--moy)':'var(--ko)');
 return '<tr><td>'+d.nom+(d.abandon?'<span style="display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;font-size:11px;font-weight:800">ABANDON</span>':'')+'</td><td>'+d.classe+'</td>'+
 '<td><a class="lien" href="'+d.fichier+'">'+d.seq+'</a></td>'+
 '<td><span class="badge" style="background:'+(d.niv==='5e'?'#16a34a':(d.niv==='4e'?'#b45309':'#1d4ed8'))+'">'+d.niv+'</span></td>'+
 '<td class="note" style="color:'+coul+'">'+String(d.note).replace('.',',')+(d.bonus>0? ' <span title="dont points Kahoot" style="font-size:11px;color:#6d28d9;font-weight:800">+'+String(d.bonus).replace('.',',')+'</span>':'')+(d.kahoot? '<div style="font-size:11px;color:#6d28d9;font-weight:700;margin-top:2px">Kahoot : '+d.kahoot.replace(/[<>&]/g,'')+'</div>':'')+'</td>'+
 '<td><div class="jauge"><div style="width:'+Math.min(100,d.note/20*100)+'%;background:'+coul+'"></div></div></td>'+
 '<td>'+(d.duree||'—')+'</td><td>'+(d.date||'—')+'</td></tr>';
 }).join('');
}
document.querySelectorAll('th[data-tri]').forEach(th=>th.addEventListener('click',()=>{
 const c=th.dataset.tri;
 tri = tri.col===c ? {col:c,sens:-tri.sens} : {col:c,sens:1};
 afficher();
}));
['fNiv','fSeq','fClasse'].forEach(id=>document.getElementById(id).addEventListener('change',afficher));
document.getElementById('fNom').addEventListener('input',afficher);
document.getElementById('rafraichir').addEventListener('click',charger);
document.getElementById('csv').addEventListener('click',()=>{

 const lignes=[['Nom','Classe','Sequence','Niveau','Note/20','Duree','Date','Kahoot']]
 .concat(L.map(d=>[d.nom,d.classe,d.seq,d.niv,String(d.note).replace('.',','),d.duree,d.date,d.kahoot || (d.bonus>0? '+'+String(d.bonus).replace('.',','):'')]));
 const csv=lignes.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));

});

<script>
/* ===== BONUS_KAHOOT — espace de saisie des points Kahoot =====
   Les points saisis ici sont appliqués AUTOMATIQUEMENT à la prochaine évaluation
   remise par l'élève, puis marqués « consommés » avec le nom de l'évaluation.
   Identification : classe + nom + prénom, sans accents ni majuscules ni espaces —
   la même règle que dans les évaluations. */
(function(){
 const URL_BONUS=BASE.replace(/evaluations\/?$/,'bonus');
 const CLASSES=['5A','5B','5C','5D','5E','4A','4B','4C','4D','4E','3A','3B','3C','3D','3E','3PM'];
 function cle(classe,nom,prenom){
  const n=function(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
   .toLowerCase().replace(/[^a-z0-9]/g,''); };
  return n(classe)+'_'+n(nom)+'_'+n(prenom);
 }
 function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
 const app=document.getElementById('appli'); if(!app) return;
 const sec=document.createElement('section');
 sec.style.cssText='margin-top:26px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px 20px';
 sec.innerHTML=
  '<h2 style="font-size:19px;color:#6d28d9;margin:0 0 4px">Points Kahoot</h2>'+
  '<div style="font-size:13px;color:#64748b;margin-bottom:12px">Ajoutés automatiquement à la prochaine '+
  'évaluation remise par l’élève, sur sa note sur 20, plafonnée à 20. Ils sont ensuite marqués consommés.</div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'+
   '<label style="font-size:12px;font-weight:700;color:#475569">Classe<br><select id="bkClasse" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1">'+
    CLASSES.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label>'+
   '<label style="font-size:12px;font-weight:700;color:#475569">Nom<br><input id="bkNom" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1;width:130px"></label>'+
   '<label style="font-size:12px;font-weight:700;color:#475569">Prénom<br><input id="bkPrenom" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1;width:120px"></label>'+
   '<label style="font-size:12px;font-weight:700;color:#475569">Points<br><select id="bkPoints" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1">'+
    '<option value="0.5">0,5</option><option value="1" selected>1</option><option value="1.5">1,5</option>'+
    '<option value="2">2</option><option value="3">3</option></select></label>'+
   '<label style="font-size:12px;font-weight:700;color:#475569">Motif<br><input id="bkMotif" value="Kahoot" style="padding:7px;border-radius:8px;border:1px solid #cbd5e1;width:150px"></label>'+
   '<button type="button" id="bkAjouter" style="background:#7c3aed;color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer">Ajouter</button>'+
  '</div>'+
  '<div id="bkMsg" style="font-size:13px;margin-top:8px;min-height:18px"></div>'+
  '<div style="margin-top:10px;padding:10px 12px;background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px">'+
   '<button type="button" id="bkVerif" style="background:#fff;color:#6d28d9;border:1.5px solid #c4b5fd;border-radius:9px;padding:7px 13px;font-weight:700;cursor:pointer">Vérifier les évaluations en ligne</button>'+
   '<span style="font-size:12.5px;color:#64748b;margin-left:10px">contrôle que les fichiers du site gèrent bien les points Kahoot</span>'+
   '<div id="bkVerifRes" style="font-size:13px;margin-top:8px"></div></div>'+
  '<div style="display:flex;gap:10px;align-items:center;margin-top:10px">'+
   '<label style="font-size:12px;font-weight:700;color:#475569">Afficher : <select id="bkFiltre" style="padding:5px;border-radius:8px;border:1px solid #cbd5e1">'+
    '<option value="">toutes les classes</option>'+CLASSES.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label>'+
   '<span id="bkResume" style="font-size:13px;color:#475569"></span></div>'+
  '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px">'+
   '<thead><tr style="background:#f8fafc;color:#155e75;text-align:left">'+
   '<th style="padding:7px">Classe</th><th style="padding:7px">Élève</th><th style="padding:7px">Points</th>'+
   '<th style="padding:7px">Motif</th><th style="padding:7px">Ajouté le</th><th style="padding:7px">État</th><th></th></tr></thead>'+
   '<tbody id="bkCorps"></tbody></table></div>';
 app.appendChild(sec);

 let LISTE=[];
 function msg(t,ok){ const m=document.getElementById('bkMsg'); m.textContent=t; m.style.color= ok? '#15803d':'#b91c1c'; }
 function afficher(){
  const f=document.getElementById('bkFiltre').value;
  const L=LISTE.filter(function(b){ return !f || b.classe===f; });
  const dispo=L.filter(function(b){return !b.consomme;}).reduce(function(s,b){return s+b.points;},0);
  const conso=L.filter(function(b){return b.consomme;}).reduce(function(s,b){return s+b.points;},0);
  document.getElementById('bkResume').textContent=
   String(dispo).replace('.',',')+' point(s) disponible(s) · '+String(conso).replace('.',',')+' consommé(s)';
  document.getElementById('bkCorps').innerHTML = L.length ? L.map(function(b){
   const d=new Date(b.date), dc=b.date_conso? new Date(b.date_conso):null;
   const etat = b.consomme
    ? '<span style="color:#64748b">consommé · '+esc((function(){ const e=(typeof EVALS!=='undefined'?EVALS:[]).find(function(x){return x.fb===b.evaluation;}); return e? e.titre : (b.evaluation||'?'); })())+(dc? ' · '+dc.toLocaleDateString('fr-FR'):'')+'</span>'
    : '<span style="color:#15803d;font-weight:700">disponible</span>';
   const suppr = b.consomme ? '' :
    '<button type="button" data-suppr="'+esc(b.cle+'/'+b.id)+'" style="background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;border-radius:7px;padding:3px 9px;cursor:pointer">Supprimer</button>';
   return '<tr style="border-top:1px solid #f1f5f9"><td style="padding:7px">'+esc(b.classe)+'</td>'+
    '<td style="padding:7px">'+esc(b.nom)+' '+esc(b.prenom)+'</td>'+
    '<td style="padding:7px;font-weight:800;color:#6d28d9">+'+String(b.points).replace('.',',')+'</td>'+
    '<td style="padding:7px">'+esc(b.motif||'')+'</td>'+
    '<td style="padding:7px">'+(isNaN(d)?'':d.toLocaleDateString('fr-FR'))+'</td>'+
    '<td style="padding:7px">'+etat+'</td><td style="padding:7px">'+suppr+'</td></tr>';
  }).join('') : '<tr><td colspan="7" style="padding:10px;color:#64748b">Aucun point saisi.</td></tr>';
 }
 async function chargerBonus(){
  try{
   const r=await fetch(URL_BONUS+'.json'); const j=await r.json(); LISTE=[];
   if(j && typeof j==='object') Object.keys(j).forEach(function(k){
    const e=j[k]; if(e && typeof e==='object') Object.keys(e).forEach(function(id){
     const b=e[id]; if(b && typeof b.points==='number') LISTE.push(Object.assign({cle:k,id:id},b));
    });
   });
   LISTE.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
   afficher();
  }catch(e){ msg('Lecture des points impossible : vérifier la connexion et les règles Firebase.',false); }
 }
 document.getElementById('bkFiltre').addEventListener('change',afficher);
 document.getElementById('bkAjouter').addEventListener('click',async function(){
  const classe=document.getElementById('bkClasse').value;
  const nom=document.getElementById('bkNom').value.trim();
  const prenom=document.getElementById('bkPrenom').value.trim();
  const points=parseFloat(document.getElementById('bkPoints').value);
  const motif=document.getElementById('bkMotif').value.trim().slice(0,80);
  if(!nom){ msg('Indique au moins le nom de l’élève.',false); return; }
  try{
   const r=await fetch(URL_BONUS+'/'+cle(classe,nom,prenom)+'.json',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({classe:classe,nom:nom,prenom:prenom,points:points,motif:motif,
     date:new Date().toISOString(),consomme:false})});
   if(!r.ok) throw new Error(r.status);
   msg('+'+String(points).replace('.',',')+' ajouté(s) à '+prenom+' '+nom+' ('+classe+').',true);
   document.getElementById('bkNom').value=''; document.getElementById('bkPrenom').value='';
   chargerBonus();
  }catch(e){ msg('Ajout refusé : les règles Firebase doivent contenir le nœud « bonus ».',false); }
 });
 document.getElementById('bkCorps').addEventListener('click',async function(e){
  const b=e.target.closest && e.target.closest('[data-suppr]'); if(!b) return;
  if(!confirm('Supprimer ces points ?')) return;
  try{ await fetch(URL_BONUS+'/'+b.dataset.suppr+'.json',{method:'DELETE'}); chargerBonus(); }
  catch(err){ msg('Suppression impossible.',false); }
 });
 /* Vérification du DÉPLOIEMENT : on relit chaque fichier d'évaluation tel que le site
    le sert réellement, et on y cherche le code Kahoot v2. Né d'un test de Mat où
    l'évaluation en ligne était restée l'ancienne version. */
 document.getElementById('bkVerif').addEventListener('click',async function(){
  const z=document.getElementById('bkVerifRes'), liste=(typeof EVALS!=='undefined'?EVALS:[]);
  z.style.color='#475569'; z.textContent='Vérification en cours…';
  const vieux=[], absents=[]; let bons=0;
  for(const e of liste){
   try{
    const r=await fetch(e.f+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok){ absents.push(e.titre); continue; }
    const t=await r.text();
    if(t.indexOf('BONUS_KAHOOT_V2')>=0) bons++; else vieux.push(e.titre+' ('+e.f+')');
   }catch(err){ absents.push(e.titre); }
  }
  if(!vieux.length && !absents.length){
   z.style.color='#15803d';
   z.textContent=bons+' / '+liste.length+' évaluations à jour : les points Kahoot seront appliqués.';
  } else {
   z.style.color='#b91c1c';
   z.innerHTML='<b>'+bons+' / '+liste.length+' à jour.</b> '+
    (vieux.length? 'Ancienne version en ligne — à redéposer : '+vieux.map(esc).join(', ')+'. ':'')+
    (absents.length? 'Introuvables : '+absents.map(esc).join(', ')+'.':'');
  }
 });
 /* chargement avec le reste du tableau de bord, et à chaque « Rafraîchir » */
 const c0=charger;
 charger=async function(){ const x=await c0.apply(this,arguments); chargerBonus(); return x; };
 window.chargerBonus=chargerBonus;
})();
</script>
</body></html>
