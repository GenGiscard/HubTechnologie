<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP CAO 2 — Formes et perçages · ESTIC</title>
<style>
:root{--bg:#e9eef5;--pan:#fff;--ink:#1c2633;--mut:#5d6b7e;--line:#d5dde8;--acc:#1f4e8c;--acc2:#e07a10;--ok:#1a8a3a;--ko:#c0352b;--soft:#f3f6fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--mut);font-size:13px}
/* bandeau */
.estic-bar{height:46px;display:flex;align-items:center;gap:16px;padding:0 14px;background:#fff;border-bottom:3px solid var(--acc)}
.eb-left{display:flex;align-items:center;gap:10px;min-width:220px}
.eb-left b{display:block;font-size:13px}.eb-left span{font-size:11.5px;color:var(--mut)}
.eb-logo{background:var(--acc);color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;padding:6px 8px;border-radius:5px}
.eb-title{flex:1;text-align:center;font-weight:700;font-size:16px;color:var(--acc)}
.eb-right{display:flex;align-items:center;gap:12px;min-width:220px;justify-content:flex-end}
.eb-copy{font-size:11px;color:var(--mut)}
/* mise en page */
#app{display:flex;height:calc(100vh - 46px)}
.panel{background:var(--pan);overflow:auto}
#mission{width:370px;flex:none;border-right:1px solid var(--line);display:none}
.mode-tp #mission,.mode-eval #mission{display:block}
#side{width:230px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-h{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 12px 6px}
#treeList{flex:1;overflow:auto;padding:0 8px 8px}
.tree-empty{color:var(--mut);font-size:13px;padding:10px;line-height:1.5}
.feat{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.feat:hover{background:var(--soft)}.feat.on{background:#eaf1fb;border-color:#b9cde8}
.feat.hid{opacity:.45}
.fic svg{width:26px;height:26px;display:block}
.ftx b{display:block;font-size:13px}.ftx span{font-size:11.5px;color:var(--mut)}
.feat-acts{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px 10px 42px}
#props{border-top:1px solid var(--line);padding-bottom:10px}
#propVals{padding:4px 12px;transition:opacity .2s}#propVals.busy{opacity:.4}
.pv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.pv b{font-family:Consolas,'Courier New',monospace;font-weight:600;font-size:12px;white-space:nowrap}
.fld{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.fld span{flex:1;color:var(--mut)}
.fld input,.fld select{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-family:Consolas,'Courier New',monospace;background:#fff}
.fld select{width:150px;font-family:inherit}
.fld em{font-style:normal;color:var(--mut);width:22px;font-size:12px}
.fld.mat{padding:0 12px}
.fld-l{margin:8px 0;font-size:13px}.fld-l>span{display:block;color:var(--mut);margin-bottom:4px}
.dis{opacity:.35;pointer-events:none}
/* boutons */
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:#9fb3cf;background:#f7f9fc}
.btn.on{background:#eaf1fb;border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:#173d70}
.btn.danger{color:var(--ko);border-color:#efc4c0}.btn.danger:hover{background:#fdf1f0}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:7px 0 0 7px;margin-left:0}.seg .btn:last-child{border-radius:0 7px 7px 0}
.seg.wide{display:flex}.seg.wide .btn{flex:1;justify-content:center}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
/* zone de travail */
#work{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.toolbar .grow{flex:1}
.toolbar .lbl{font-size:12px;color:var(--mut);margin-left:6px}
#stage{flex:1;position:relative;min-height:0}
#view3d,#sketchView{position:absolute;inset:0}
#view3d canvas{position:absolute;left:0;top:0}
#ov{cursor:grab}#ov:active{cursor:grabbing}
.nogl{padding:40px;color:var(--ko);font-weight:600}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff7e8;border:1px solid #f0c27a;padding:8px 14px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.floating{position:absolute;top:14px;right:14px;width:310px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(20,40,70,.16)}
#planeDlg{width:360px;left:50%;right:auto;transform:translateX(-50%)}
.fl-title{font-weight:700;font-size:15px;margin-bottom:10px}
.planes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.plane-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.plane-btn:hover{border-color:var(--acc);background:#f4f8fd}
.plane-btn svg{width:60px;height:44px}.plane-btn b{font-size:13px}.plane-btn span{font-size:11px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;cursor:pointer}
/* esquisse */
#sketchView{display:flex;flex-direction:column}
.toolbar.sk{background:#fffaf3;border-bottom-color:#f0d8b6}
.skplane{color:var(--acc2);margin-right:8px;font-size:13.5px}
.skbody{flex:1;display:flex;min-height:0}
#skwrap{flex:1;position:relative;min-width:0}
#skc{position:absolute;left:0;top:0;touch-action:none}
#skwarn{position:absolute;top:10px;left:10px;background:#fdecea;border:1px solid #f0b4ae;color:var(--ko);padding:7px 11px;border-radius:7px;font-size:13px}
#skprops{width:250px;flex:none;border-left:1px solid var(--line);padding:6px 12px 14px}
.pp-title{font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.entlist{display:flex;flex-wrap:wrap;gap:4px}
.entbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.entbtn.on{border-color:var(--acc2);color:var(--acc2);background:#fff6ec}
.ptrow{display:flex;align-items:center;gap:4px}.ptrow b{font-size:12px;width:24px;color:var(--mut)}
.ptrow .fld{margin:3px 0}.ptrow .fld input{width:62px}.ptrow .fld em{display:none}.ptrow .fld span{flex:none}
/* modal, toast */
#modal{position:fixed;inset:0;background:rgba(18,30,48,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBox{background:#fff;border-radius:14px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modalBox h3{margin:0 0 10px;color:var(--acc)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center}
.toast{background:#1c2633;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;transition:opacity .4s}
.toast.warn{background:#a8431c}.toast.ok{background:var(--ok)}.toast.out{opacity:0}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}
.help-grid div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:13px}
.help-grid span{color:var(--mut)}
.help-steps{padding-left:20px;line-height:1.7;font-size:13.5px}
body.locked [data-act="new-sketch"],body.locked [data-act="new-file"],body.locked [data-act="open-file"]{opacity:.35;pointer-events:none}
/* ===== missions ===== */
.m-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.m-team{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut)}
.m-team b{color:var(--ink)}
.prog{height:8px;background:#e5ebf3;border-radius:5px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f6db8,#1a8a3a);transition:width .5s}
.m-tabs{display:flex;gap:5px;flex-wrap:wrap}
.m-tab{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--mut);position:relative;font-size:13px}
.m-tab.cur{border-color:var(--acc);color:var(--acc);background:#eaf1fb}
.m-tab.done{background:var(--ok);border-color:var(--ok);color:#fff}
.m-tab.part{background:#fff3df;border-color:#f0c27a;color:#a8641c}
.m-tab.q{width:auto;padding:0 10px}
.m-body{padding:12px 14px 30px}
.m-kicker{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc2)}
.m-title{font-size:19px;font-weight:700;margin:2px 0 6px}
.m-pitch{font-size:13.5px;color:#3a4758;margin:0 0 10px;line-height:1.45}
.tgt{position:relative;height:250px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f4f7fb}
.tgt canvas{position:absolute;left:0;top:0}
.tgt-bar{display:flex;gap:4px;margin:6px 0 10px;align-items:center}
.tgt-bar span{font-size:11.5px;color:var(--mut);margin-left:auto}
.method{border:1px solid var(--line);border-radius:10px;margin:8px 0}
.method summary{padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--acc)}
.method ol{margin:0;padding:2px 14px 10px 32px;font-size:13px;line-height:1.65}
.gpop{position:absolute;inset:0;background:#fffaf0f0;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:10px}
.gpop>div{background:#fff;border:2px solid #16a34a;border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px #0002}.gpop b{color:#15803d;font-size:13.5px}.gpop p{margin:5px 0 9px;font-size:13.5px;line-height:1.4}.gpop .btn{width:100%}
.gd{position:relative;border:2px solid #f9b13c;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fffaf0}
.gd .gh{display:flex;justify-content:space-between;font-size:12px;color:#92400e}.gd .gt{font-size:13.5px;line-height:1.5;margin:6px 0 8px}
.gd .gt b{color:#1e3a5f}.gd img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;display:block;margin-bottom:6px}
.gd .gdots{display:flex;gap:3px;margin:4px 0 8px}.gd .gdots i{flex:1;height:5px;border-radius:3px;background:#e2e8f0}.gd .gdots i.d{background:#16a34a}.gd .gdots i.c{background:#f9b13c}
.gd .gn{display:flex;justify-content:space-between;gap:8px}
.verify{margin-top:10px}
.res{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--soft)}
.res.ok{background:#e9f6ed;border-color:#a8d8b6}.res.ko{background:#fdf1f0;border-color:#efc4c0}
.res .ln{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.res .ln i{font-style:normal;font-weight:700;width:16px}
.res .ln.g i{color:var(--ok)}.res .ln.b i{color:var(--ko)}
.qbox{margin-top:14px;border:1px solid #d9c9f0;background:#faf7ff;border-radius:10px;padding:10px 12px}
.qbox .qt{font-weight:600;font-size:13.5px;margin-bottom:8px}
.qbox .qrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qbox input{width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-family:Consolas,'Courier New',monospace}
.qbox .unit{color:var(--mut);font-size:13px}
.qopts{display:flex;flex-direction:column;gap:5px}
.qopt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}
.qopt:hover{border-color:#a993d6}.qopt.on{border-color:#6c48b8;background:#efe8fb;color:#4a2b8c;font-weight:600}
.qopt.good{border-color:var(--ok);background:#e9f6ed}.qopt.bad{border-color:var(--ko);background:#fdf1f0}
.qfb{font-size:12.5px;margin-top:6px}.qfb.g{color:var(--ok)}.qfb.b{color:var(--ko)}
.order{display:flex;flex-direction:column;gap:4px}
.order .it{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px}
.order .it b{color:var(--mut);width:16px}.order .it span{flex:1}
.order .it button{border:1px solid var(--line);background:#fff;border-radius:5px;width:26px;height:24px;cursor:pointer}
.pts{float:right;font-size:12px;font-weight:700;color:var(--mut);background:var(--soft);border-radius:20px;padding:2px 9px}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.start-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.start-grid input,.start-grid select{padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit;color:var(--ink)}
.comp{font-size:12.5px;background:var(--soft);border-radius:9px;padding:9px 12px;margin:8px 0;line-height:1.55}
.comp b{color:var(--acc)}
.scoreBig{font-size:42px;font-weight:700;color:var(--acc);text-align:center;margin:6px 0}
table.res-t{width:100%;border-collapse:collapse;font-size:12.5px}
table.res-t th,table.res-t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.res-t th{background:var(--soft);font-weight:600}
.corr{margin-top:10px;border:1px solid #a8d8b6;background:#f2faf4;border-radius:10px;padding:10px 12px;font-size:13px}
.corr h4{margin:0 0 6px;color:var(--ok);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.submit-zone{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
/* calculatrice */
#calc{position:fixed;right:18px;bottom:18px;width:270px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:10px;z-index:40}
#calc .cd{display:flex;gap:6px;margin-bottom:6px}
#calc input{flex:1;font-family:Consolas,'Courier New',monospace;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px}
#calc .co{font-family:Consolas,'Courier New',monospace;text-align:right;font-size:17px;font-weight:600;padding:4px 6px;color:var(--acc);min-height:26px}
#calc .ck{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#calc .ck button{padding:7px 0;border:1px solid var(--line);background:#f7f9fc;border-radius:6px;cursor:pointer;font-family:Consolas,'Courier New',monospace;font-size:12.5px}
#calc .ck button.eq{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (max-width:1560px){.mode-tp .tools .tl,.mode-eval .tools .tl{display:none}}
@media (max-width:1250px){.tools .tl{display:none}}
@media (max-width:1100px){#side{width:210px}#mission{width:320px}#skprops{width:210px}}
@media (max-width:800px){#app{flex-direction:column;height:auto}#mission,#side{width:100%;max-height:none}#work{height:80vh}.eb-copy,.eb-left span{display:none}}

.cote-edit{position:absolute;width:80px;height:30px;border:2px solid var(--acc2);border-radius:6px;text-align:center;font:600 14px Consolas,'Courier New',monospace;color:#b4261a;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5}

#asmPanel{display:none;flex:1;overflow:auto}
body.ws-asm #asmPanel{display:block}body.ws-asm #treeList,body.ws-asm #props,body.ws-asm .part-only{display:none!important}
.pad{padding:2px 12px 8px}.alist{padding:0 8px}
.apart{border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff}
.ah{display:flex;align-items:center;gap:7px;padding:7px 8px;cursor:pointer;font-size:13px}.ah i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ah .grow{flex:1}.x{border:none;background:none;color:var(--mut);cursor:pointer;font-size:13px}.x:hover{color:var(--ko)}
.aedit{padding:2px 10px 10px;border-top:1px dashed var(--line)}.aedit .fld input{width:72px}
.badge{font-size:10.5px;background:#e8eef7;color:var(--acc);border-radius:10px;padding:1px 7px;font-weight:600;font-style:normal}.badge.m{background:#fde8e6;color:var(--ko)}
.ajoint{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:5px 6px;border-bottom:1px dashed var(--line)}.ajoint span{flex:1}
#drawView{position:absolute;inset:0;z-index:30;display:flex;background:#e9eef5}#drwPanel{width:270px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px;overflow:auto}#drwSheet{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}#drwCv{position:static!important;inset:auto!important;width:auto;height:auto;box-shadow:0 6px 24px #0003;background:#fff;cursor:crosshair}.dsec{border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}.dsec>b{color:#1e3a5f;font-size:13.5px}
#cutDlg{width:270px;right:14px;top:14px;left:auto}#cutDlg input[type=range]{width:100%}
#simDlg{width:330px;max-height:calc(100% - 28px);overflow:auto}
.sim-sec{border-top:1px solid var(--line);padding:8px 0 4px;font-size:13px}.sim-sec>b{display:block;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.chip{background:#eef3fa;border:1px solid #c9d7ea;border-radius:14px;padding:2px 4px 2px 9px;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.chip button{border:none;background:none;cursor:pointer;color:var(--mut)}.chip.load{background:#fdecea;border-color:#f0b4ae;padding-right:9px}
.simres{margin-top:10px;border:1px solid #a8d8b6;background:#f2faf4;border-radius:10px;padding:8px 10px}.simres.bad{background:#fdf1f0;border-color:#efc4c0}
.pv.big b{font-size:15px;color:var(--acc)}
#kinPanel{position:absolute;left:12px;right:12px;bottom:12px;height:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,40,70,.16);display:flex;flex-direction:column;padding:8px 10px}
.kin-h{display:flex;align-items:center;gap:8px;font-size:13px}.kin-h select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12.5px}.kin-h .grow{flex:1}
.kin-c{flex:1;position:relative;min-height:0}.kin-c canvas{position:absolute;left:0;top:0}
#kinRead{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;padding-top:4px}

</style>
</head>
<body class="mode-tp">
<header class="estic-bar">
  <div class="eb-left"><img alt="Logo ESTIC" src="logo_estic.png" style="height:36px"><div><b>Professeur AGOSTINI</b><span>Technologie · ESTIC</span></div></div>
  <div class="eb-title">TP CAO 2 — Formes et perçages</div>
  <div class="eb-right"><span id="ebExtra"></span><span class="eb-copy">&copy; ESTIC &mdash; Tous droits r&eacute;serv&eacute;s</span></div>
</header>
<div id="app">
  <aside id="mission" class="panel"></aside>
  <aside id="side" class="panel">
    <div class="side-h">Arbre de construction</div>
    <div id="treeList"></div>
    <div id="asmPanel"></div>
    <div id="props">
      <div class="side-h">Propri&eacute;t&eacute;s</div>
      <label class="fld mat"><span>Mat&eacute;riau</span><select id="matSel"></select></label>
      <div id="propVals"></div>
    </div>
  </aside>
  <main id="work">
    <div id="tb3d" class="toolbar">

function drawCotes(c, vw, cotes) {

  const col = '#b4261a';

    const w = c.measureText(txt).width + 8; x = Math.max(w / 2 + 2, Math.min(vw.w - w / 2 - 2, x)); y = Math.max(11, Math.min(vw.h - 11, y)); c.fillStyle = 'rgba(255,255,255,.92)'; c.fillRect(x - w / 2, y - 9, w, 18);

      const Q = [0, 1, 2].map(i => k.c[i] + (fr.u[i] * Math.cos(ang) + fr.v[i] * Math.sin(ang)) * (r + (k.lead || 12)));

      arrow(p[0], p[1], Math.atan2(p[1] - q[1], p[0] - q[0]));

    const ang = Math.atan2(pb2[1] - pa2[1], pb2[0] - pa2[0]);

        if (sm.F && Math.abs(res.F - sm.F) > 1e-6) { ok = false; why.push('effort attendu : ' + sm.F + ' N'); }
        if (sm.vmax && Math.abs(res.vmax - sm.vmax) / sm.vmax > (sm.tol || 0.15)) { ok = false; why.push('\u03c3max obtenue ' + fmtN(res.vmax, 1) + ' MPa : v\u00e9rifie l\u2019encastrement, la face charg\u00e9e et la direction'); }
        if (sm.minS && res.s < sm.minS) { ok = false; why.push('coefficient de s\u00e9curit\u00e9 ' + fmtN(res.s, 2) + ' insuffisant'); }

        out.asmOk = ok; L(ok, ok ? 'Mouvement correct : course de ' + G.fmt(r.course, 2) + ' mm' : (r.course == null ? 'Pi\u00e8ce \u00ab ' + ac.course.name + ' \u00bb introuvable' : 'Le mouvement ne donne pas la bonne course (' + G.fmt(r.course, 2) + ' mm)')); }

  verify() {

const Calc = {

  toggle() {

      el.innerHTML = `<div class="cd"><input id="cIn" placeholder="ex : 26*cos(45)"><button class="btn sm" data-act="calc">Fermer</button></div><div class="co" id="cOut"></div>
        <div class="ck">${K.map(k => `<button data-ck="${k}" class="${k === '=' ? 'eq' : ''}">${k}</button>`).join('')}</div>`;
      el.addEventListener('click', e => { const b = e.target.closest('[data-ck]'); if (!b) return; this.key(b.dataset.ck, b); });
      $('#cIn').addEventListener('keydown', e => { if (e.key === 'Enter') this.eval(); });
    }
    el.classList.remove('hidden');
  },
  key(k, b) {
    const i = $('#cIn');
    if (k === '=') return this.eval();
    if (k === 'C') { i.value = ''; $('#cOut').textContent = ''; return; }
    if (k === '⌫') { i.value = i.value.slice(0, -1); return; }
    if (k === 'DEG' || k === 'RAD') { this.deg = !this.deg; b.textContent = this.deg ? 'DEG' : 'RAD'; b.dataset.ck = b.textContent; return; }
    i.value += k; i.focus();
  },
  eval() {
    let s = $('#cIn').value.replace(/,/g, '.').replace(/π/g, '(PI)').replace(/√/g, 'sqrt').replace(/\^/g, '**').replace(/×/g, '*');
    if (/[^0-9+\-*/().\sA-Za-z]/.test(s) || /[A-Za-z]+/g.test(s.replace(/\b(sin|cos|tan|asin|acos|atan|sqrt|ln|log|PI)\b/g, ''))) { $('#cOut').textContent = 'Erreur'; return; }
    const k = this.deg ? Math.PI / 180 : 1;
    const env = { sin: x => Math.sin(x * k), cos: x => Math.cos(x * k), tan: x => Math.tan(x * k), asin: x => Math.asin(x) / k, acos: x => Math.acos(x) / k, atan: x => Math.atan(x) / k, sqrt: Math.sqrt, ln: Math.log, log: Math.log10, PI: Math.PI };
    try { const v = Function(...Object.keys(env), 'return (' + s + ');')(...Object.values(env)); $('#cOut').textContent = isFinite(v) ? String(Math.round(v * 1e6) / 1e6).replace('.', ',') : 'Erreur'; }
    catch (_) { $('#cOut').textContent = 'Erreur'; }
  }
};
window.addEventListener('DOMContentLoaded', () => { CAD.init(); MS.init(); });

</script>
</body>
