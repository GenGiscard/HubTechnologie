<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construire une éolienne Savonius en papier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f2a5a;--red:#d6303b;--ink:#1d2433;--mute:#5b6478;--bg:#eef1f6;--line:#dde3ee;--org:#f59e0b;--ok:#16a34a;--okL:#e7f7ec;--bad:#dc2626;--badL:#fdecec}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Lexend,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
header img{height:40px}
.ttl h1{font-size:20px;margin:0;color:var(--navy)}
.ttl small{color:var(--mute);font-size:13px}
.nom{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.nom input{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;width:200px}
#rail{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
.rb{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px 6px 6px;font-size:13px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.rb b{width:24px;height:24px;border-radius:50%;background:#e8ecf4;display:grid;place-items:center;font-size:12px}
.rb.on{border-color:var(--navy);background:#eef2ff}
.rb.on b{background:var(--navy);color:#fff}
.rb.done b{background:var(--ok);color:#fff}
#main{flex:1;display:grid;grid-template-columns:410px 1fr;gap:16px;padding:16px 20px;min-height:0}
#main.isfull{grid-template-columns:1fr}
#main.isfull .info,#main.isfull .visual{display:none}
.info{background:#fff;border-radius:16px;padding:22px;overflow:auto;border:1px solid var(--line)}
.kick{font-size:13px;font-weight:600;color:var(--red);letter-spacing:.04em;text-transform:uppercase}
.info h2{margin:4px 0 12px;font-size:26px;color:var(--navy);line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.chip.lab{background:#e8ecf4;color:var(--ink);font-weight:500}
ol.cons{margin:0 0 14px;padding:0;list-style:none;counter-reset:c}
ol.cons li{counter-increment:c;position:relative;padding:10px 10px 10px 46px;border-radius:12px;background:#f6f8fb;margin-bottom:8px;font-size:16px;line-height:1.4}
ol.cons li::before{content:counter(c);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-size:13px;font-weight:700}
.box{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px;line-height:1.4;border-left:5px solid}
.box b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.box.tip{background:#eef6ff;border-color:#3b82f6}
.box.tip b{color:#1d4ed8}
.box.warn{background:var(--badL);border-color:var(--bad)}
.box.warn b{color:var(--bad)}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mat div{background:#f6f8fb;border-radius:10px;padding:8px 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.mat svg{flex:0 0 28px}
.doneBtn{width:100%;border:2px solid var(--ok);background:#fff;color:var(--ok);border-radius:12px;padding:12px;font-weight:600;font-size:16px;margin-top:6px}
.doneBtn.on{background:var(--ok);color:#fff}
.visual{background:#fff;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;min-height:480px;overflow:hidden}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stage{flex:1;position:relative;min-height:0;background:#f4f1ea}
.view{position:absolute;inset:0;display:none;padding:14px}
.view.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#v3d{padding:0;background:linear-gradient(#f7f9fc,#e9edf4)}
#cv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#cv:active{cursor:grabbing}
.ctrl3d{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.ctrl3d button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;color:var(--ink)}
.ctrl3d button.on{background:var(--org);border-color:var(--org);color:#fff}
.hint3d{position:absolute;right:12px;top:12px;font-size:12px;color:var(--mute);background:#fffc;padding:4px 8px;border-radius:8px}
.leg3d{position:absolute;left:12px;top:12px;font-size:13px;display:flex;gap:12px;background:#fffd;padding:6px 10px;border-radius:10px}
.leg3d i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid #0003}
.gsvg{width:min(100%,820px);height:auto;max-height:calc(100% - 50px);border-radius:14px;box-shadow:0 2px 14px #0000001a}
.cap{margin:0;font-size:17px;font-weight:500;color:var(--navy);text-align:center;max-width:680px;min-height:1.4em}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,820px);max-height:calc(100% - 50px);overflow:auto;padding:4px}
.gal button{border:none;padding:0;background:none;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px #0002;transition:transform .15s}
.gal button:hover{transform:translateY(-3px)}
.gal img{display:block;width:100%;height:auto}
.pcs{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;max-height:calc(100% - 50px);overflow:auto;padding:6px}
.pcs figure{margin:0;background:#fff;border-radius:12px;padding:8px;box-shadow:0 3px 14px #0002;text-align:center}
.pcs img{display:block;max-height:340px;max-width:100%;border-radius:6px}
.pcs figcaption{font-size:14px;font-weight:600;color:var(--navy);margin-top:6px}
.zoom{position:absolute;inset:0;background:#1d2433e6;display:flex;align-items:center;justify-content:center;z-index:5;cursor:zoom-out;padding:16px}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.g3d{width:100%;height:calc(100% - 50px);perspective:1100px;position:relative;border-radius:14px;background:radial-gradient(ellipse at 50% 85%,#e3d7bf 0%,#efe8da 55%,#f4f1ea 100%)}
.rig{position:absolute;left:50%;top:48%;transform-style:preserve-3d}
.pan{position:absolute;top:0;transform-style:preserve-3d;transform-origin:0 50%;border:1.6px solid #4a4a4a;background:#fff}
.pan .n{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;border:2px solid #333;display:grid;place-items:center;font-size:14px;font-weight:700;background:transparent;color:#333}
.pan .tb{position:absolute;left:-1.6px;right:-1.6px;height:22px;border:1.6px solid #4a4a4a;background:inherit}
.pan .tb.t{top:-22px;border-bottom:none}
.pan .tb.b{bottom:-22px;border-top:none}
.pan .glue{position:absolute;inset:8px 5px;backface-visibility:hidden;transform:translateZ(1px);border-radius:4px;background:radial-gradient(circle at 35% 30%,#fff9c4,#facc15cc);opacity:0}
.floorSh{position:absolute;left:50%;top:78%;width:200px;height:34px;margin-left:-100px;border-radius:50%;background:radial-gradient(#5a46282e,#5a462800 70%)}
.wbtn{border:none;background:var(--navy);color:#fff;border-radius:14px;padding:14px 26px;font-size:17px;font-weight:600;user-select:none;touch-action:none}
.wbtn.on{background:var(--red)}
.wrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.meter{font-size:15px;color:var(--mute)}
.meter b{color:var(--navy);font-size:22px}
footer{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#fff;border-top:1px solid var(--line)}
.nav{border:none;border-radius:12px;padding:11px 22px;font-weight:600;font-size:15px;background:var(--navy);color:#fff}
.nav.sec{background:#e8ecf4;color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
#prog{font-size:14px;color:var(--mute)}
.full{background:#fff;border-radius:16px;border:1px solid var(--line);padding:24px;overflow:auto}
.qwrap{max-width:900px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
.qhead h2{margin:0;color:var(--navy);font-size:26px}
.score{font-size:18px;font-weight:600;color:var(--navy);background:#eef2ff;border-radius:12px;padding:8px 14px}
.q{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.q h3{margin:0 0 10px;font-size:17px;font-weight:600}
.q h3 span{color:var(--red);margin-right:6px}
.q img{max-height:220px;display:block;margin:0 auto 10px;border-radius:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:#f8f9fc;border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.good{background:var(--okL);border-color:var(--ok);font-weight:600}
.opt.bad{background:var(--badL);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px;display:none}
.fb.on{display:block}
.fb.g{background:var(--okL);color:#14532d}
.fb.b{background:var(--badL);color:#7f1d1d}
.bil{max-width:760px;margin:0 auto;text-align:center}
.bil h2{color:var(--navy);font-size:30px;margin:6px 0}
.bigs{display:flex;gap:14px;justify-content:center;margin:18px 0}
.bigs div{background:#f6f8fb;border-radius:14px;padding:16px 24px;min-width:200px}
.bigs b{display:block;font-size:34px;color:var(--navy)}
.bl{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left;margin-top:10px}
.bl div{padding:8px 10px;border-radius:8px;background:#f6f8fb;font-size:14px}
.bl div.y{background:var(--okL)}
.bl div.n{background:var(--badL)}
@media (max-width:980px){#main{grid-template-columns:1fr}.visual{min-height:460px}.opts{grid-template-columns:1fr}.gal{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function quizScore(){return qAns.reduce((a,v)=>a+(v===0?1:0),0);}
function renderQuiz(){
  let h=`<div class="qwrap"><div class="qhead"><h2>Quiz : as-tu bien compris ?</h2><div class="score">Score : ${quizScore()} / ${QUIZ.length}</div></div>`;
  QUIZ.forEach((q,i)=>{

    qOrder[i].forEach(k=>{
      let c=""; if(qAns[i]>=0){ if(k===0)c=" good"; else if(k===qAns[i])c=" bad"; }
      h+=`<button class="opt${c}" data-act="ans" data-q="${i}" data-k="${k}"${qAns[i]>=0?" disabled":""}>${esc(q.o[k])}</button>`;
    });

function renderBilan(){

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="go") go(+b.dataset.i);
  else if(a==="next") go(cur+1);
  else if(a==="prev") go(cur-1);
  else if(a==="tab"){ tab=+b.dataset.i; renderTabs(); showView(); }
  else if(a==="done"){ done[cur]=!done[cur]; renderInfo(); renderRail(); $("#prog").textContent=`${done.filter(Boolean).length} étape(s) terminée(s) sur ${NS}`; }
  else if(a==="ans"){ const i=+b.dataset.q; if(qAns[i]<0){ qAns[i]=+b.dataset.k; renderQuiz(); } }
  else if(a==="replay"){ stageT=performance.now(); }
  else if(a==="spin"){ spin=!spin; b.classList.toggle("on",spin); }
  else if(a==="nums"){ allNums=!allNums; b.classList.toggle("on",allNums); }
  else if(a==="view"){ yaw=-.62; pitch=.42; dist=900; }
  else if(a==="zoom"){ const z=document.createElement("div"); z.className="zoom"; z.dataset.act="unzoom"; z.innerHTML=`<img src="${IMG[b.dataset.k]}" alt="Planche agrandie">`; $("#vG").appendChild(z); }
  else if(a==="unzoom"){ b.remove(); }
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight") go(cur+1);
  if(e.key==="ArrowLeft") go(cur-1);
});

function arcPts(cx,cy,r,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n; p.push([cx+r*Math.cos(a),cy-r*Math.sin(a)]);} return p; }
function crescentPts(cx,cy,r,a0,a1,k){ // arc extérieur + arc intérieur creusé
  const o=arcPts(cx,cy,r,a0,a1,36), inn=[];
  for(let i=36;i>=0;i--){ const a=a0+(a1-a0)*i/36; inn.push([cx+r*Math.cos(a),cy-k*r*Math.sin(a)]); }
  return o.concat(inn);
}

  if(cv.width!==Wc||cv.height!==Hc){cv.width=Wc;cv.height=Hc;}
  const W=cv.width, H=cv.height, ctx=cx3;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  if(stage3d===99&&!drag) yaw+=dt*.25;
  spinV+=((spin?1:0)-spinV)*Math.min(1,dt*2); spinA+=spinV*dt*4;
  const T=[0,135,0], D=dist, f=Math.min(W,H)*1.6;
  const cyw=Math.cos(yaw), syw=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const rotV=v=>{const x1=v[0]*cyw-v[2]*syw, z1=v[0]*syw+v[2]*cyw; return [x1, v[1]*cp-z1*sp, v[1]*sp+z1*cp];};
  const tf=p=>rotV([p[0]-T[0],p[1]-T[1],p[2]-T[2]]);
  const prj=q=>[W/2+f*q[0]/(D-q[2]), H*.5-f*q[1]/(D-q[2])];
  const cs=Math.cos(spinA), ss=Math.sin(spinA);
  const spinP=p=>[p[0]*cs-p[2]*ss,p[1],p[0]*ss+p[2]*cs];
  const L=nrm([.35,.8,.55]), SUN=[.45,1,.3];
  const el=(now-stageT)/1000;
  // table
  const G0=[[-420,0,-340],[420,0,-340],[420,0,340],[-420,0,340]].map(p=>prj(tf(p)));
  const tg=ctx.createLinearGradient(0,H*.3,0,H); tg.addColorStop(0,"#e9e0cc"); tg.addColorStop(1,"#d8c9a9");
  ctx.beginPath(); G0.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fillStyle=tg; ctx.fill();
  const polys=[], labels=[]; const shadow=new Path2D();
  let idx=0;
  PARTS.forEach(P=>{
    if(P.step>stage3d) return;
    const cur3=P.step===stage3d;
    let k=1; if(cur3){ k=ease(clamp((el-.3-(idx++)*.35)/1.1)); }
    const off=P.from.map(v=>v*(1-k));
    const base=cur3&&P.col==="paper"?COL.hi:COL[P.col];
    const wp=p=>{ const q=P.rot?spinP(p):p; return [q[0]+off[0],q[1]+off[1],q[2]+off[2]]; };
    P.faces.forEach(F=>{
      const wpts=F.pts.map(wp);
      // ombre portée sur la table
      const sp2=wpts.map(p=>prj(tf([p[0]-SUN[0]*p[1]/SUN[1],0,p[2]-SUN[2]*p[1]/SUN[1]])));
      sp2.forEach((q,i)=>i?shadow.lineTo(q[0],q[1]):shadow.moveTo(q[0],q[1])); shadow.closePath();
      const vp=wpts.map(tf);
      let n=rotV(P.rot?spinP(F.n):F.n);
      const m=ctr(vp); const view=[-m[0],-m[1],D-m[2]];
      const dd=dot(n,view);
      if(!F.two&&dd<=0) return;
      if(F.two&&dd<0) n=n.map(v=>-v);
      const sh=.8+.2*Math.max(0,dot(n,L));
      polys.push({scr:vp.map(prj),z:D-m[2],c:base.map(v=>Math.round(v*sh)),sm:F.sm});
    });
    if(P.num&&allNums){ const q=tf(wp(P.anc)); const s=prj(q); labels.push({x:s[0],y:s[1],n:P.num,hi:cur3}); }
  });
  ctx.fillStyle="rgba(70,52,25,.16)"; ctx.fill(shadow,"nonzero");
  polys.sort((a,b)=>b.z-a.z);
  ctx.lineJoin="round";
  polys.forEach(p=>{
    ctx.beginPath(); p.scr.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.fillStyle=`rgb(${p.c[0]},${p.c[1]},${p.c[2]})`; ctx.fill();
    if(p.sm){ ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=1.2*dpr; ctx.stroke(); }
    else { ctx.strokeStyle="rgba(50,50,55,.55)"; ctx.lineWidth=.9*dpr; ctx.stroke(); }
  });
  ctx.font=`700 ${13*dpr}px Lexend,sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
  labels.forEach(l=>{
    ctx.beginPath(); ctx.arc(l.x,l.y,13*dpr,0,Math.PI*2); ctx.fillStyle=l.hi?"#1f2a5a":"rgba(31,42,90,.75)"; ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=2*dpr; ctx.stroke();
    ctx.fillStyle="#fff"; ctx.fillText(l.n,l.x,l.y+.5*dpr);
  });
  m3dRAF=requestAnimationFrame(draw3d);
}

go(0);
</script>
